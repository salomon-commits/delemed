<!DOCTYPE html>
<html lang="fr">
<head>

  <meta property="og:title" content="Formation Délégué Médical — Guide Interactif & Terrain">
  <meta property="og:description" content="Application de formation interactive et autonome pour nouveaux délégués médicaux : modules complets, quiz certifiants, fiches terrain et plan d'action 30 jours.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* =====================================================================
       VARIABLES DE THÈME & TYPOGRAPHIE SYSTÈME
       ===================================================================== */
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --primary-dark: #172554;
      --accent: #0284c7;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-inverted: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      --sidebar-width: 320px;
      --header-height: 64px;
      --bottombar-height: 68px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --primary-dark: #93c5fd;
      --accent: #38bdf8;
      --success: #34d399;
      --success-light: #064e3b;
      --warning: #fbbf24;
      --warning-light: #78350f;
      --danger: #f87171;
      --danger-light: #7f1d1d;
      --bg: #090d16;
      --surface: #111827;
      --surface-subtle: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-inverted: #0f172a;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }

    /* =====================================================================
       RESET ET BASE
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    a, button {
      font-family: inherit;
      color: inherit;
      transition: all 0.2s ease;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font-size: 0.95rem;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* =====================================================================
       LAYOUT GÉNÉRAL (APP WRAPPER)
       ===================================================================== */
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* =====================================================================
       BARRE LATÉRALE (SIDEBAR)
       ===================================================================== */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-header {
      padding: 1.15rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.3);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .sidebar-search-box {
      padding: 0.85rem 1.25rem 0.65rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    .search-input {
      width: 100%;
      padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
    }

    .search-clear {
      position: absolute;
      right: 0.6rem;
      color: var(--text-muted);
      padding: 2px;
      display: none;
    }

    .sidebar-filters {
      display: flex;
      gap: 0.35rem;
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      background: var(--surface-subtle);
    }

    .filter-chip {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-full);
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .sidebar-progress {
      padding: 0.85rem 1.25rem;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.45rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
      width: 0%;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.5rem;
    }

    .module-group {
      margin-bottom: 0.75rem;
    }

    .module-header {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      user-select: none;
    }

    .module-header:hover {
      background: var(--surface-subtle);
    }

    .module-title-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .module-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      background: var(--primary-light);
      color: var(--primary);
    }

    .chevron-icon {
      transition: transform 0.25s ease;
      color: var(--text-muted);
    }

    .module-group.collapsed .chevron-icon {
      transform: rotate(-90deg);
    }

    .module-group.collapsed .section-list {
      display: none;
    }

    .section-list {
      list-style: none;
      margin-top: 0.25rem;
      padding-left: 0.5rem;
    }

    .section-item {
      margin-bottom: 0.15rem;
    }

    .section-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: 0.83rem;
      color: var(--text-muted);
      text-align: left;
      border: 1px solid transparent;
    }

    .section-link:hover {
      background: var(--surface-subtle);
      color: var(--text-main);
    }

    .section-link.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      border-color: rgba(29, 78, 216, 0.2);
    }

    .section-link-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-meta-icons {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .read-check-icon {
      color: var(--success);
      width: 14px;
      height: 14px;
    }

    .fav-star-icon {
      color: var(--warning);
      width: 14px;
      height: 14px;
    }

    .quiz-pill {
      font-size: 0.68rem;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-full);
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 700;
    }

    [data-theme="dark"] .quiz-pill {
      background: #312e81;
      color: #c7d2fe;
    }

    .sidebar-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .timer-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-reset-sidebar {
      color: var(--text-muted);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
    }

    .btn-reset-sidebar:hover {
      color: var(--danger);
      background: var(--danger-light);
    }

    /* =====================================================================
       ZONE PRINCIPALE (HEADER + CONTENT + BOTTOMBAR)
       ===================================================================== */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .topbar {
      height: var(--header-height);
      min-height: var(--header-height);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .btn-menu-toggle {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .breadcrumb-box {
      display: flex;
      flex-direction: column;
    }

    .breadcrumb-module {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .breadcrumb-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      max-width: 480px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: var(--surface);
      white-space: nowrap;
    }

    .action-btn:hover {
      background: var(--surface-subtle);
      color: var(--text-main);
    }

    .action-btn.active {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .action-btn.favorite-active {
      color: var(--warning);
      border-color: var(--warning);
      background: var(--warning-light);
    }

    .action-btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .action-btn-primary:hover {
      background: var(--primary-hover);
      color: white;
    }

    /* ZONE DE DÉFILEMENT DU CONTENU */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 1.5rem 6rem;
      scroll-behavior: smooth;
    }

    .content-container {
      max-width: 860px;
      margin: 0 auto;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =====================================================================
       TYPOGRAPHIE & ÉLÉMENTS DE COURS
       ===================================================================== */
    .module-hero-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #0284c7 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-md);
    }

    .module-hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .module-hero-title {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 0.75rem;
    }

    .module-hero-objective {
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.95;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      background: rgba(0, 0, 0, 0.15);
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md);
      margin-top: 1rem;
    }

    .section-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .section-meta-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .section-body {
      font-size: 1.05rem;
      color: var(--text-main);
      line-height: 1.75;
    }

    .section-body h3 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 2.2rem 0 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-body h4 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--primary);
      margin: 1.5rem 0 0.75rem;
    }

    .section-body p {
      margin-bottom: 1.25rem;
    }

    .section-body ul, .section-body ol {
      margin: 1rem 0 1.5rem 1.5rem;
    }

    .section-body li {
      margin-bottom: 0.6rem;
    }

    .section-body strong {
      color: var(--text-main);
      font-weight: 700;
    }

    /* ENCADRÉS PÉDAGOGIQUES */
    .callout {
      border-radius: var(--radius-md);
      padding: 1.25rem 1.4rem;
      margin: 1.75rem 0;
      border-left: 5px solid transparent;
      box-shadow: var(--shadow-sm);
    }

    .callout-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .callout-content {
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .callout-content p:last-child {
      margin-bottom: 0;
    }

    /* Point Clé */
    .callout-key {
      background: var(--primary-light);
      border-left-color: var(--primary);
    }
    .callout-key .callout-header {
      color: var(--primary);
    }

    /* Attention */
    .callout-warning {
      background: var(--warning-light);
      border-left-color: var(--warning);
    }
    .callout-warning .callout-header {
      color: #b45309;
    }
    [data-theme="dark"] .callout-warning .callout-header {
      color: #fbbf24;
    }

    /* Exemple Concret */
    .callout-example {
      background: var(--success-light);
      border-left-color: var(--success);
    }
    .callout-example .callout-header {
      color: #047857;
    }
    [data-theme="dark"] .callout-example .callout-header {
      color: #34d399;
    }

    /* Dialogue médical stylisé */
    .dialogue-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin: 1.5rem 0;
    }
    .dialogue-speaker {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }
    .dialogue-text {
      font-style: italic;
      margin-bottom: 0.75rem;
    }
    .dialogue-analysis {
      font-size: 0.9rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 0.5rem;
    }

    /* TABLEAUX */
    .styled-table-wrapper {
      overflow-x: auto;
      margin: 1.5rem 0 2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .styled-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
      background: var(--surface);
    }
    .styled-table th {
      background: var(--surface-subtle);
      color: var(--text-main);
      font-weight: 700;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .styled-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .styled-table tr:last-child td {
      border-bottom: none;
    }
    .styled-table tr:hover td {
      background: var(--primary-light);
    }

    /* =====================================================================
       ZONE QUIZ INTERACTIF
       ===================================================================== */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin: 2rem 0;
      box-shadow: var(--shadow-sm);
    }

    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .quiz-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
    }

    .quiz-score-pill {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      background: var(--primary-light);
      color: var(--primary);
    }

    .question-card {
      margin-bottom: 2rem;
      padding: 1.25rem;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
    }

    .question-prompt {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.45;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .option-btn.selected .option-letter {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background: var(--success-light) !important;
      color: var(--text-main) !important;
    }
    .option-btn.correct .option-letter {
      background: var(--success) !important;
      color: white !important;
      border-color: var(--success) !important;
    }

    .option-btn.incorrect {
      border-color: var(--danger) !important;
      background: var(--danger-light) !important;
      color: var(--text-main) !important;
    }
    .option-btn.incorrect .option-letter {
      background: var(--danger) !important;
      color: white !important;
      border-color: var(--danger) !important;
    }

    .feedback-box {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      line-height: 1.55;
      animation: fadeIn 0.2s ease;
    }

    .feedback-box.correct {
      background: var(--success-light);
      border: 1px solid var(--success);
      color: var(--text-main);
    }

    .feedback-box.incorrect {
      background: var(--danger-light);
      border: 1px solid var(--danger);
      color: var(--text-main);
    }

    .quiz-summary-card {
      text-align: center;
      padding: 2rem;
      background: var(--surface-subtle);
      border-radius: var(--radius-md);
      margin-top: 1.5rem;
    }

    .summary-score-large {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .summary-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.35rem 1rem;
      border-radius: var(--radius-full);
      margin-bottom: 1rem;
    }

    /* =====================================================================
       PAGE D'ACCUEIL / TABLE DES MATIÈRES COMPLÈTE
       ===================================================================== */
    .home-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 2.75rem 2rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .home-hero-content {
      position: relative;
      z-index: 2;
      max-width: 680px;
    }

    .home-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }

    .home-title {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .home-subtitle {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 1.75rem;
    }

    .home-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn-hero {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      background: white;
      color: #1e3a8a;
      box-shadow: var(--shadow-md);
    }
    .btn-hero:hover {
      background: #f8fafc;
      transform: translateY(-2px);
    }

    .btn-hero-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn-hero-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .dashboard-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }

    .metric-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary);
      flex-shrink: 0;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .module-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    .module-toc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .module-toc-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    .module-toc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .module-toc-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .module-toc-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.55;
    }

    .toc-sections-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.5rem;
      list-style: none;
    }

    .toc-section-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-main);
      text-decoration: none;
    }

    .toc-section-pill:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* =====================================================================
       BARRE DE NAVIGATION INFÉRIEURE (BOTTOMBAR)
       ===================================================================== */
    .bottombar {
      height: var(--bottombar-height);
      min-height: var(--bottombar-height);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 30;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.15rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.88rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--surface-subtle);
      border-color: var(--primary);
      color: var(--primary);
    }

    .nav-btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .nav-btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      color: white;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border);
    }

    .position-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-toc-jump {
      font-size: 0.78rem;
      color: var(--primary);
      margin-top: 0.15rem;
      text-decoration: underline;
    }

    /* =====================================================================
       MODAL & TOAST
       ===================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.15s ease;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 500px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .modal-body {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .toast {
      position: fixed;
      bottom: 85px;
      right: 24px;
      background: var(--text-main);
      color: var(--text-inverted);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 110;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* CERTIFICAT DE VALIDATION */
    .certificate-card {
      border: 6px double #1d4ed8;
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      background: #ffffff;
      color: #0f172a;
      text-align: center;
      margin: 2rem 0;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .cert-heading {
      font-size: 2rem;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .cert-sub {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    .cert-name {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      border-bottom: 2px solid #1d4ed8;
      display: inline-block;
      padding: 0 2rem 0.4rem;
      margin-bottom: 1.5rem;
    }

    .cert-statement {
      max-width: 600px;
      margin: 0 auto 2rem;
      font-size: 1rem;
      line-height: 1.6;
      color: #334155;
    }

    .cert-seal {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4);
    }

    /* =====================================================================
       MEDIA PRINT (OPTIMISATION IMPRESSION A4 & EXPORT PDF)
       ===================================================================== */
    @media print {
      body {
        background: white !important;
        color: black !important;
        height: auto !important;
        overflow: visible !important;
      }

      #app {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
      }

      .sidebar,
      .topbar,
      .bottombar,
      .toast,
      .modal-overlay,
      .quiz-container,
      .action-btn,
      .btn-hero,
      .btn-hero-secondary {
        display: none !important;
      }

      .main-wrapper {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
      }

      .content-scroll {
        overflow: visible !important;
        height: auto !important;
        padding: 0 !important;
      }

      .content-container {
        max-width: 100% !important;
        margin: 0 !important;
      }

      .module-hero-card {
        background: #f1f5f9 !important;
        color: black !important;
        border: 1px solid #cbd5e1 !important;
        page-break-after: avoid;
      }

      .callout {
        border-left: 4px solid #64748b !important;
        background: #f8fafc !important;
        color: black !important;
        page-break-inside: avoid;
      }

      .styled-table-wrapper {
        border: 1px solid #94a3b8 !important;
        box-shadow: none !important;
      }

      .styled-table th {
        background: #e2e8f0 !important;
        color: black !important;
      }
    }

    /* =====================================================================
       RESPONSIVE & MOBILE
       ===================================================================== */
    @media (max-width: 900px) {
      .btn-menu-toggle {
        display: inline-flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        z-index: 35;
        display: none;
      }

      .sidebar-backdrop.active {
        display: block;
      }

      .topbar {
        padding: 0 0.75rem;
        gap: 0.5rem;
      }

      .breadcrumb-title {
        max-width: 130px;
        font-size: 0.85rem;
      }

      .breadcrumb-module {
        font-size: 0.7rem;
      }

      .action-btn {
        padding: 0.45rem 0.55rem;
      }

      .action-btn span {
        display: none;
      }

      .content-scroll {
        padding: 1.25rem 0.85rem 5rem;
      }

      .home-hero {
        padding: 1.75rem 1.25rem;
      }

      .home-title {
        font-size: 1.6rem;
      }

      .bottombar {
        padding: 0 0.85rem;
      }

      .nav-btn {
        padding: 0.55rem 0.85rem;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- BACKDROP MOBILE -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="app.closeSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand" onclick="app.navigateToHome()">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              <path d="M12 5v14"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">Délégué Médical</div>
            <div class="brand-subtitle">Guide d'Excellence Terrain</div>
          </div>
        </div>
      </div>

      <!-- RECHERCHE RAPIDE -->
      <div class="sidebar-search-box">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un terme, RCP, loi..." oninput="app.handleSearch(this.value)">
        </div>
      </div>

      <!-- FILTRES RAPIDES -->
      <div class="sidebar-filters">
        <button class="filter-chip active" id="filterAll" onclick="app.setFilter('all')">Tous</button>
        <button class="filter-chip" id="filterFav" onclick="app.setFilter('bookmarks')">Favoris</button>
        <button class="filter-chip" id="filterUnread" onclick="app.setFilter('unread')">Non lus</button>
        <button class="filter-chip" id="filterQuiz" onclick="app.setFilter('quizzes')">Quiz</button>
      </div>

      <!-- JAUGE DE PROGRESSION -->
      <div class="sidebar-progress">
        <div class="progress-info">
          <span>Progression globale</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- LISTE DES MODULES ET SECTIONS -->
      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <!-- PIED DE BARRE LATÉRALE -->
      <div class="sidebar-footer">
        <div class="timer-badge" title="Temps d'apprentissage effectif">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="studyTimerDisplay">00:00</span>
        </div>
        <button class="btn-reset-sidebar" onclick="app.confirmReset()" title="Réinitialiser ma progression">Réinitialiser</button>
      </div>
    </aside>

    <!-- WRAPPER CONTENU PRINCIPAL -->
    <div class="main-wrapper">
      <!-- HEADER / TOPBAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-menu-toggle" onclick="app.toggleSidebar()" aria-label="Ouvrir le menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
          </button>
          <div class="breadcrumb-box">
            <div id="breadcrumbModule" class="breadcrumb-module">Formation Délégué Médical</div>
            <div id="breadcrumbTitle" class="breadcrumb-title">Table des matières générale</div>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Marquer comme lu -->
          <button id="btnMarkRead" class="action-btn" onclick="app.toggleCurrentRead()" style="display: none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span id="btnMarkReadLabel">Marquer comme lu</span>
          </button>

          <!-- Ajouter aux favoris -->
          <button id="btnBookmark" class="action-btn" onclick="app.toggleCurrentBookmark()" style="display: none;" title="Ajouter aux favoris">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <span id="btnBookmarkLabel">Favori</span>
          </button>

          <!-- Mode Sombre / Clair -->
          <button class="action-btn" onclick="app.toggleDarkMode()" title="Changer le thème">
            <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </button>

          <!-- Imprimer / Exporter PDF -->
          <button class="action-btn" onclick="window.print()" title="Imprimer ou enregistrer en PDF">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>
            </svg>
          </button>

          <!-- Télécharger ce fichier HTML autonome -->
          <button class="action-btn action-btn-primary" onclick="app.downloadStandaloneFile()" title="Télécharger le fichier .html complet pour usage hors-ligne permanent">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
            <span>Télécharger .html</span>
          </button>
        </div>
      </header>

      <!-- ZONE DE CONTENU DYNAMIQUE -->
      <div class="content-scroll" id="contentScroll">
        <main class="content-container" id="mainContent"></main>
      </div>

      <!-- FOOTER / BOTTOMBAR NAVIGATION -->
      <footer class="bottombar" id="bottomBar">
        <button id="btnPrev" class="nav-btn" onclick="app.navigateRelative(-1)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>Précédent</span>
        </button>

        <div class="position-indicator">
          <span id="positionText">Section 1 / 37</span>
          <button class="btn-toc-jump" onclick="app.navigateToHome()">Table des matières</button>
        </div>

        <button id="btnNext" class="nav-btn nav-btn-primary" onclick="app.navigateRelative(1)">
          <span>Suivant</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </footer>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span id="toastMessage">Progression enregistrée</span>
    </div>

    <!-- MODALE DE CONFIRMATION -->
    <div id="modalContainer"></div>
  </div>

  <!-- =====================================================================
       CONTENU COMPLET ET MOTEUR JAVASCRIPT AUTONOME (VANILLA JS PUR)
       ===================================================================== -->
  <script>
    /**

                <ul>

                <h3>La structure C.A.P.B. d'un argument clinique percutant</h3>
                <ul>
                  <li><strong>C - Caractéristique :</strong> La donnée pharmacologique brute (ex. demi-vie d'élimination de 36 heures).</li>
                  <li><strong>A - Avantage :</strong> La conséquence clinique immédiate (ex. maintien d'une couverture thérapeutique constante même en cas de prise décalée de quelques heures).</li>
                  <li><strong>P - Preuve :</strong> L'étude clinique pivot ou le paragraphe du RCP attestant le résultat (ex. étude RESOLVE publiée dans le Lancet avec p &lt; 0.001).</li>

    /**
     * ÉTAT GLOBAL DE L'APPLICATION (PERSISTÉ DANS LOCALSTORAGE)
     */
    class MedicalTrainingApp {
      constructor() {
        this.currentSectionId = "home";
        this.readSections = [];
        this.bookmarks = [];
        this.quizScores = {};
        this.studyTimeSeconds = 0;
        this.timerInterval = null;
        this.planChecklist = {};
        this.isDarkMode = false;
        this.activeFilter = "all";
        this.searchQuery = "";
        this.allSectionsFlat = [];

        this.initFlatSections();
        this.loadState();
        this.initTheme();
        this.startTimer();
        this.bindGlobalKeyboard();
        this.renderSidebar();
        this.renderView();
      }

      initFlatSections() {
        this.allSectionsFlat = [];
        for (const mod of COURSE_MODULES) {
          for (const sec of mod.sections) {
            this.allSectionsFlat.push({
              ...sec,
              moduleId: mod.id,
              moduleTitle: mod.title,
              moduleBadge: mod.badge
            });
          }
        }
      }

      loadState() {
        try {
          const raw = localStorage.getItem("dm_training_app_state_v2");
          if (raw) {
            const data = JSON.parse(raw);
            this.readSections = Array.isArray(data.readSections) ? data.readSections : [];
            this.bookmarks = Array.isArray(data.bookmarks) ? data.bookmarks : [];
            this.quizScores = typeof data.quizScores === "object" ? data.quizScores : {};
            this.studyTimeSeconds = Number(data.studyTimeSeconds) || 0;
            this.planChecklist = typeof data.planChecklist === "object" ? data.planChecklist : {};
            this.isDarkMode = Boolean(data.isDarkMode);
            this.currentSectionId = data.lastVisited || "home";
          }
        } catch (e) {
          console.warn("Impossible de charger l'état local", e);
        }
      }

      saveState() {
        try {
          const payload = {
            readSections: this.readSections,
            bookmarks: this.bookmarks,
            quizScores: this.quizScores,
            studyTimeSeconds: this.studyTimeSeconds,
            planChecklist: this.planChecklist,
            isDarkMode: this.isDarkMode,
            lastVisited: this.currentSectionId
          };
          localStorage.setItem("dm_training_app_state_v2", JSON.stringify(payload));
        } catch (e) {
          console.warn("Erreur sauvegarde locale", e);
        }
      }

      initTheme() {
        if (this.isDarkMode) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
        this.updateThemeIcon();
      }

      toggleDarkMode() {
        this.isDarkMode = !this.isDarkMode;
        this.initTheme();
        this.saveState();
        this.showToast(this.isDarkMode ? "Mode sombre activé" : "Mode clair activé");
      }

      updateThemeIcon() {
        const icon = document.getElementById("themeIcon");
        if (!icon) return;
        if (this.isDarkMode) {
          icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
          icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
        }
      }

      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
          this.studyTimeSeconds += 1;
          this.updateTimerDisplay();
          if (this.studyTimeSeconds % 15 === 0) {
            this.saveState();
          }
        }, 1000);
        this.updateTimerDisplay();
      }

      updateTimerDisplay() {
        const el = document.getElementById("studyTimerDisplay");
        if (!el) return;
        const total = this.studyTimeSeconds;
        const hrs = Math.floor(total / 3600);
        const mins = Math.floor((total % 3600) / 60);
        const secs = total % 60;
        if (hrs > 0) {
          el.textContent = `${hrs}h ${mins.toString().padStart(2, "0")}m`;
        } else {
          el.textContent = `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
        }
      }

      showToast(msg) {
        const toast = document.getElementById("toast");
        const msgEl = document.getElementById("toastMessage");
        if (!toast || !msgEl) return;
        msgEl.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
      }

      toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebarBackdrop");
        if (!sidebar) return;
        sidebar.classList.toggle("open");
        backdrop?.classList.toggle("active");
      }

      closeSidebar() {
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebarBackdrop");
        sidebar?.classList.remove("open");
        backdrop?.classList.remove("active");
      }

      bindGlobalKeyboard() {
        window.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.key === "ArrowLeft") {
            this.navigateRelative(-1);
          } else if (e.key === "ArrowRight") {
            this.navigateRelative(1);
          } else if (e.key === "Escape") {
            this.closeSidebar();
            this.closeModal();
          } else if (e.key.toLowerCase() === "m" && this.currentSectionId !== "home") {
            this.toggleCurrentRead();
          } else if (e.key.toLowerCase() === "b" && this.currentSectionId !== "home") {
            this.toggleCurrentBookmark();
          }
        });
      }

      /* CALCUL DE LA PROGRESSION GLOBALE */
      calculateOverallProgress() {
        const total = this.allSectionsFlat.length;
        if (total === 0) return 0;
        const readCount = new Set(this.readSections).size;
        return Math.min(100, Math.round((readCount / total) * 100));
      }

      updateProgressBar() {
        const pct = this.calculateOverallProgress();
        const bar = document.getElementById("progressBar");
        const txt = document.getElementById("progressText");
        if (bar) bar.style.width = pct + "%";
        if (txt) txt.textContent = pct + "%";
      }

      /* NAVIGATION & GESTION DES FILTRES */
      setFilter(filterName) {
        this.activeFilter = filterName;
        document.querySelectorAll(".filter-chip").forEach((btn) => btn.classList.remove("active"));
        if (filterName === "all") document.getElementById("filterAll")?.classList.add("active");
        if (filterName === "bookmarks") document.getElementById("filterFav")?.classList.add("active");
        if (filterName === "unread") document.getElementById("filterUnread")?.classList.add("active");
        if (filterName === "quizzes") document.getElementById("filterQuiz")?.classList.add("active");
        this.renderSidebar();
      }

      handleSearch(query) {
        this.searchQuery = (query || "").trim().toLowerCase();
        this.renderSidebar();
      }

      toggleCurrentRead() {
        if (this.currentSectionId === "home") return;
        const id = this.currentSectionId;
        if (this.readSections.includes(id)) {
          this.readSections = this.readSections.filter((item) => item !== id);
          this.showToast("Section marquée comme non lue");
        } else {
          this.readSections.push(id);
          this.showToast("Section marquée comme lue ! +1");
        }
        this.saveState();
        this.updateTopBarActions();
        this.updateProgressBar();
        this.renderSidebar();
      }

      toggleCurrentBookmark() {
        if (this.currentSectionId === "home") return;
        const id = this.currentSectionId;
        if (this.bookmarks.includes(id)) {
          this.bookmarks = this.bookmarks.filter((item) => item !== id);
          this.showToast("Retiré des favoris");
        } else {
          this.bookmarks.push(id);
          this.showToast("Ajouté aux favoris");
        }
        this.saveState();
        this.updateTopBarActions();
        this.renderSidebar();
      }

      navigateToHome() {
        this.currentSectionId = "home";
        this.saveState();
        this.closeSidebar();
        this.renderView();
        this.renderSidebar();
      }

      navigateToSection(secId) {
        this.currentSectionId = secId;
        this.saveState();
        this.closeSidebar();
        this.renderView();
        this.renderSidebar();
        const scrollEl = document.getElementById("contentScroll");
        if (scrollEl) scrollEl.scrollTop = 0;
      }

      navigateRelative(offset) {
        if (this.currentSectionId === "home") {
          if (offset > 0 && this.allSectionsFlat.length > 0) {
            this.navigateToSection(this.allSectionsFlat[0].id);
          }
          return;
        }

        const idx = this.allSectionsFlat.findIndex((s) => s.id === this.currentSectionId);
        if (idx === -1) return;

        const targetIdx = idx + offset;
        if (targetIdx < 0) {
          this.navigateToHome();
        } else if (targetIdx < this.allSectionsFlat.length) {
          this.navigateToSection(this.allSectionsFlat[targetIdx].id);
        }
      }

        const container = document.getElementById("sidebarNav");
        if (!container) return;

        // Lien vers la page d'accueil / sommaire
        const isHomeActive = this.currentSectionId === "home";
        html += `
          <div class="module-group">
            <button class="section-link ${isHomeActive ? "active" : ""}" onclick="app.navigateToHome()">

        for (const mod of COURSE_MODULES) {

          if (this.activeFilter === "bookmarks") {
            visibleSections = visibleSections.filter((s) => this.bookmarks.includes(s.id));
          } else if (this.activeFilter === "unread") {
            visibleSections = visibleSections.filter((s) => !this.readSections.includes(s.id));
          } else if (this.activeFilter === "quizzes") {
            visibleSections = visibleSections.filter((s) => s.isQuiz || s.isFinalExam);
          }

          // Recherche textuelle
          if (this.searchQuery) {
            visibleSections = visibleSections.filter((s) => {
              const inTitle = s.title.toLowerCase().includes(this.searchQuery);
              const inKey = s.keywords?.some((k) => k.toLowerCase().includes(this.searchQuery));
              return inTitle || inKey;
            });
          }

          if (visibleSections.length === 0 && (this.activeFilter !== "all" || this.searchQuery)) {
            continue;
          }

          const hasActiveSection = mod.sections.some((s) => s.id === this.currentSectionId);

          html += `
            <div class="module-group" id="modGroup-${mod.id}">
              <button class="module-header" onclick="app.toggleModuleCollapse(${mod.id})">
                <div class="module-title-box">
                  <span class="module-badge">${mod.badge}</span>
                  <span style="font-size: 0.8rem;">${mod.title}</span>

                <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          html += `

        container.innerHTML = html;

      /* MOTEUR DE MINI-QUIZ INTERACTIF */
      mountQuiz(moduleId, mountId) {
        const mount = document.getElementById(mountId);
        if (!mount) return;

        const questions = QUIZ_DATA[moduleId] || [];
        const savedResult = this.quizScores[moduleId];

        let html = `
          <div class="quiz-container">
            <div class="quiz-header">
              <div class="quiz-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                <span>Quiz d'auto-évaluation du Module ${moduleId}</span>
              </div>
              <div class="quiz-score-pill" id="quizScoreBadge-${moduleId}">
                ${savedResult ? `Score : ${savedResult.score} / ${savedResult.total} (${savedResult.pct}%)` : `${questions.length} questions`}
              </div>
            </div>
            <div id="quizQuestionsBox-${moduleId}">
        `;

        questions.forEach((q, qIndex) => {
          html += `
            <div class="question-card" id="qCard-${moduleId}-${q.id}">
              <div class="question-prompt">${qIndex + 1}. ${q.question}</div>
              <div class="options-list">
          `;

          q.options.forEach((opt, optIndex) => {
            const letter = String.fromCharCode(65 + optIndex);
            html += `
              <button class="option-btn" id="optBtn-${q.id}-${optIndex}" onclick="app.handleQuizAnswer(${moduleId}, ${q.id}, ${optIndex})">
                <span class="option-letter">${letter}</span>
                <span>${opt}</span>
              </button>
            `;
          });

          html += `
              </div>
              <div id="feedback-${q.id}" style="display: none;"></div>
            </div>
          `;
        });

        html += `
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
              <button class="action-btn" onclick="app.resetQuiz(${moduleId})">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
                </svg>
                <span>Recommencer le quiz</span>
              </button>
            </div>
          </div>
        `;

        mount.innerHTML = html;

        // Si le quiz avait déjà été rempli auparavant, réafficher l'état
        if (savedResult && savedResult.userAnswers) {
          for (const [qid, ansIdx] of Object.entries(savedResult.userAnswers)) {
            this.handleQuizAnswer(moduleId, Number(qid), Number(ansIdx), true);
          }
        }
      }

      handleQuizAnswer(moduleId, questionId, chosenIndex, silent = false) {
        const questions = QUIZ_DATA[moduleId] || [];
        const q = questions.find((item) => item.id === questionId);
        if (!q) return;

        // Mettre à jour l'affichage des options
        q.options.forEach((_, idx) => {
          const btn = document.getElementById(`optBtn-${questionId}-${idx}`);
          if (!btn) return;
          btn.classList.remove("selected", "correct", "incorrect");
          btn.disabled = true;

          if (idx === q.correctIndex) {
            btn.classList.add("correct");
          } else if (idx === chosenIndex) {
            btn.classList.add("incorrect");
          }
        });

        // Afficher l'encadré d'explication
        const feedback = document.getElementById(`feedback-${questionId}`);
        if (feedback) {
          const isCorrect = chosenIndex === q.correctIndex;
          feedback.className = `feedback-box ${isCorrect ? "correct" : "incorrect"}`;
          feedback.style.display = "block";
          feedback.innerHTML = `
            <strong>${isCorrect ? "✓ Excellente réponse !" : "✗ Réponse incorrecte."}</strong>
            <p style="margin-top: 0.35rem;">${q.explanation}</p>
          `;
        }

        // Enregistrer la réponse
        if (!this.quizScores[moduleId]) {
          this.quizScores[moduleId] = { userAnswers: {}, score: 0, total: questions.length, pct: 0 };
        }
        this.quizScores[moduleId].userAnswers[questionId] = chosenIndex;

        // Recalculer le score du module
        let correctCount = 0;
        let answeredCount = 0;
        for (const item of questions) {
          const ans = this.quizScores[moduleId].userAnswers[item.id];
          if (ans !== undefined) {
            answeredCount++;
            if (ans === item.correctIndex) correctCount++;
          }
        }

        this.quizScores[moduleId].score = correctCount;
        this.quizScores[moduleId].pct = Math.round((correctCount / questions.length) * 100);

        const badge = document.getElementById(`quizScoreBadge-${moduleId}`);
        if (badge) {
          badge.textContent = `Score : ${correctCount} / ${questions.length} (${this.quizScores[moduleId].pct}%)`;
        }

        if (!silent) {
          this.saveState();
          if (answeredCount === questions.length) {
            this.showToast(`Quiz Module ${moduleId} terminé ! Score : ${correctCount}/${questions.length}`);
            // Marquer automatiquement la section comme lue si score >= 75%
            if (this.quizScores[moduleId].pct >= 75 && !this.readSections.includes(this.currentSectionId)) {
              this.readSections.push(this.currentSectionId);
              this.updateTopBarActions();
              this.updateProgressBar();
              this.renderSidebar();
            }
          }
        }
      }

      resetQuiz(moduleId) {
        if (this.quizScores[moduleId]) {
          delete this.quizScores[moduleId];
          this.saveState();
        }
        this.mountQuiz(moduleId, `quiz-mount-${moduleId}`);
        this.showToast("Quiz réinitialisé");
      }

      }

      filterGlossary(query) {
        const q = (query || "").toLowerCase().trim();
        const cards = document.querySelectorAll(".glossary-card");
        cards.forEach((card) => {
          const content = card.getAttribute("data-term") || "";
          card.style.display = content.includes(q) ? "block" : "none";
        });
      }

      /* GRAND EXAMEN FINAL & CERTIFICAT OFFICIEL */
      mountFinalExam() {
        const mount = document.getElementById("finalQuizMount");
        if (!mount) return;

        const questions = QUIZ_DATA["final"] || [];
        const saved = this.quizScores["final"];

        let html = `
          <div class="quiz-container">
            <div class="quiz-header">
              <div class="quiz-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
                </svg>
                <span>Grand Examen de Certification (10 questions)</span>
              </div>
              <div class="quiz-score-pill" id="quizScoreBadge-final">
                ${saved ? `Score : ${saved.score} / ${saved.total} (${saved.pct}%)` : `10 questions`}
              </div>
            </div>
            <div id="quizQuestionsBox-final">
        `;

        questions.forEach((q, qIndex) => {
          html += `
            <div class="question-card" id="qCard-final-${q.id}">
              <div class="question-prompt">${qIndex + 1}. ${q.question}</div>
              <div class="options-list">
          `;

          q.options.forEach((opt, optIndex) => {
            const letter = String.fromCharCode(65 + optIndex);
            html += `
              <button class="option-btn" id="optBtn-${q.id}-${optIndex}" onclick="app.handleQuizAnswer('final', ${q.id}, ${optIndex})">
                <span class="option-letter">${letter}</span>
                <span>${opt}</span>
              </button>
            `;
          });

          html += `
              </div>
              <div id="feedback-${q.id}" style="display: none;"></div>
            </div>
          `;
        });

        html += `
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
              <button class="action-btn" onclick="app.resetQuiz('final')">Recommencer l'examen</button>
            </div>
          </div>
        `;

        // Affichage de l'Attestation si le score >= 80%
        if (saved && saved.pct >= 80) {
          html += `
            <div class="certificate-card" id="officialCertificate">
              <div class="cert-seal">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
              </div>
              <div class="cert-heading">CERTIFICAT DE FORMATION PROFESSIONNELLE</div>
              <div class="cert-sub">Validation des Aptitudes Fondamentales & Déontologiques</div>
              <p>Il est officiellement certifié que</p>
              <div class="cert-name" contenteditable="true" title="Cliquez pour modifier votre nom">Élève Délégué Médical</div>
              <p class="cert-statement">
                a complété avec succès l'ensemble du cursus de formation théorique et terrain <strong>Délégué Médical — Niveau Débutant à Intermédiaire</strong>, démontrant une maîtrise attestée du cadre réglementaire de l'ANSM/HAS, de la Charte de l'information promotionnelle, de la pharmacovigilance et des techniques d'entretien en cabinet médical.
              </p>
              <div style="display: flex; justify-content: space-around; margin-top: 2rem; border-top: 1px solid #cbd5e1; padding-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
                <div>
                  <strong>Score obtenu :</strong> ${saved.score} / ${saved.total} (${saved.pct}%)
                </div>
                <div>
                  <strong>Délivré le :</strong> ${new Date().toLocaleDateString("fr-FR")}
                </div>
                <div>
                  <strong>Mention :</strong> Opérationnel Terrain Validé
                </div>
              </div>
              <div style="margin-top: 2rem;">
                <button class="btn-hero" onclick="window.print()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>
                  </svg>
                  Imprimer mon attestation officielle (PDF)
                </button>
              </div>
            </div>
          `;
        }

        mount.innerHTML = html;

        if (saved && saved.userAnswers) {
          for (const [qid, ansIdx] of Object.entries(saved.userAnswers)) {
            this.handleQuizAnswer("final", Number(qid), Number(ansIdx), true);
          }
        }
      }

      /* RÉINITIALISATION DE LA PROGRESSION */
      confirmReset() {
        const container = document.getElementById("modalContainer");
        if (!container) return;

        container.innerHTML = `
          <div class="modal-overlay" onclick="app.closeModal(event)">
            <div class="modal-card" onclick="event.stopPropagation()">
              <div class="modal-title">Réinitialiser la progression ?</div>
              <div class="modal-body">
                Êtes-vous sûr de vouloir réinitialiser vos sections lues, vos scores aux quiz, vos jalons du plan 30 jours et vos favoris ? Cette action est irréversible.
              </div>
              <div class="modal-actions">
                <button class="action-btn" onclick="app.closeModal()">Annuler</button>
                <button class="action-btn" style="background: var(--danger); color: white; border-color: var(--danger);" onclick="app.executeReset()">Oui, réinitialiser tout</button>
              </div>
            </div>
          </div>
        `;
      }

      closeModal() {
        const container = document.getElementById("modalContainer");
        if (container) container.innerHTML = "";
      }

      executeReset() {
        this.readSections = [];
        this.bookmarks = [];
        this.quizScores = {};
        this.studyTimeSeconds = 0;
        this.planChecklist = {};
        this.currentSectionId = "home";
        this.saveState();
        this.closeModal();
        this.updateProgressBar();
        this.renderSidebar();
        this.renderView();
        this.showToast("Progression réinitialisée à zéro");
      }

      /* TÉLÉCHARGEMENT DU FICHIER HTML AUTONOME (POUR UTILISATION 100% HORS LIGNE) */
      downloadStandaloneFile() {
        try {
          const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "formation-delegue-medical-autonome.html";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          this.showToast("Fichier HTML autonome téléchargé avec succès !");
        } catch (e) {
          console.error("Erreur de téléchargement", e);
          this.showToast("Erreur lors de la génération du fichier");
        }
      }
    }

    // Instanciation de l'application autonome
    let app;
    window.addEventListener("DOMContentLoaded", () => {
      app = new MedicalTrainingApp();
      window.app = app;
    });
  </script>
</body>
</html>
