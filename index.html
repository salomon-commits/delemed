<!--
  Institut d'Excellence Yonah — Délégué Médical Professionnel
  Version : 4.0 (Parcours Certifiant Complet : 30 Modules & 8 Tracks de Spécialisation)
  Date : 2026-10-28
  Fichier autonome — Aucune connexion requise (Offline-First)
  Certificat infalsifiable : YONAH-DM-2025-XXXXXX (Vérifiable)
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Institut Yonah — Délégué Médical d'Élite : Du Débutant à l'Expert</title>
  <meta name="description" content="Formation certifiante complète de référence pour délégués médicaux et cadres pharmaceutiques : 30 modules fondamentaux et 8 tracks de spécialisation. Institut d'Excellence Yonah (Abidjan).">
  <meta property="og:title" content="Institut Yonah — Délégué Médical d'Élite">
  <meta property="og:description" content="Parcours d'élite certifiant de 30 modules et 8 tracks de spécialisation pour devenir Délégué Médical d'Excellence.">
  <meta name="theme-color" content="#0B3D5C">

  <style>
    /* =====================================================================
       SYSTÈME DE DESIGN INSTITUT YONAH — THÈMES & TYPOGRAPHIE
       ===================================================================== */
    :root {
      --yonah-navy: #0B3D5C;
      --yonah-navy-dark: #062335;
      --yonah-navy-light: #16537b;
      --yonah-gold: #D4A24C;
      --yonah-gold-light: #fef7ec;
      --yonah-gold-dark: #a87926;
      --yonah-emerald: #0E7C66;
      --yonah-emerald-light: #e6f6f2;
      --yonah-cream: #F8F5EE;
      --yonah-gray: #4A5568;
      --yonah-gray-light: #718096;
      --yonah-danger: #C53030;
      --yonah-danger-light: #FFF5F5;
      --yonah-warning: #DD6B20;
      --yonah-warning-light: #FFFAF0;

      --bg: #F8F5EE;
      --surface: #FFFFFF;
      --surface-subtle: #F0EDE4;
      --border: #E2DBD0;
      --border-focus: #0B3D5C;
      --text-main: #1A202C;
      --text-muted: #4A5568;
      --text-on-dark: #FFFFFF;

      --shadow-sm: 0 1px 3px rgba(11, 61, 92, 0.08);
      --shadow-md: 0 4px 12px rgba(11, 61, 92, 0.12);
      --shadow-lg: 0 10px 25px rgba(11, 61, 92, 0.18);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --touch-min: 44px;
    }

    [data-theme="dark"] {
      --bg: #061824;
      --surface: #0B283D;
      --surface-subtle: #103753;
      --border: #1B4C72;
      --border-focus: #D4A24C;
      --text-main: #F7FAFC;
      --text-muted: #CBD5E0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-system);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.65;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 1rem;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      user-select: none;
    }

    #appWrapper {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRE SUPÉRIEURE */
    .topbar {
      height: 60px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .brand-logo-svg {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--yonah-navy);
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    [data-theme="dark"] .brand-name {
      color: var(--yonah-gold);
    }

    .brand-sub {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--yonah-gray-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      min-width: var(--touch-min);
      min-height: var(--touch-min);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: var(--surface-subtle);
      color: var(--text-main);
    }

    .icon-btn.btn-institution {
      background: var(--yonah-gold-light);
      color: var(--yonah-gold-dark);
      border: 1px solid var(--yonah-gold);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0 0.75rem;
      gap: 0.4rem;
    }

    [data-theme="dark"] .icon-btn.btn-institution {
      background: rgba(212, 162, 76, 0.2);
      color: var(--yonah-gold);
    }

    /* BARRE LATÉRALE */
    .sidebar {
      width: 320px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 45;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-user-card {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-subtle);
    }

    .user-avatar-badge {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--yonah-navy);
      color: var(--yonah-gold);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--yonah-gold);
    }

    .user-info-text {
      display: flex;
      flex-direction: column;
    }

    .user-name-display {
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--text-main);
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-level-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--yonah-emerald);
    }

    .sidebar-level-filters {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.3rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tier-tab-btn {
      white-space: nowrap;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .tier-tab-btn.active {
      background: var(--yonah-navy);
      color: var(--text-on-dark);
      border-color: var(--yonah-navy);
    }

    [data-theme="dark"] .tier-tab-btn.active {
      background: var(--yonah-gold);
      color: var(--yonah-navy-dark);
      border-color: var(--yonah-gold);
    }

    .sidebar-search-box {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-field {
      width: 100%;
      height: 36px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 0.8rem 0 2.2rem;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
    }

    .search-input-field:focus {
      border-color: var(--border-focus);
    }

    .search-icon-inside {
      position: absolute;
      left: 0.7rem;
      pointer-events: none;
      color: var(--text-muted);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem 0.5rem;
    }

    .tier-group-header {
      padding: 0.7rem 0.6rem 0.3rem;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--yonah-gold-dark);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .mod-group {
      margin-bottom: 0.35rem;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .mod-header-btn {
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--text-main);
      border-radius: var(--radius-md);
    }

    .mod-header-btn:hover {
      background: var(--surface-subtle);
    }

    .mod-header-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      overflow: hidden;
    }

    .badge-number {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      background: var(--surface-subtle);
      color: var(--yonah-navy);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    [data-theme="dark"] .badge-number {
      color: var(--yonah-gold);
    }

    .sec-list {
      list-style: none;
      padding: 0.2rem 0 0.2rem 1rem;
    }

    .sec-link-btn {
      width: 100%;
      text-align: left;
      padding: 0.45rem 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      line-height: 1.35;
    }

    .sec-link-btn:hover {
      background: var(--surface-subtle);
      color: var(--text-main);
    }

    .sec-link-btn.active {
      background: rgba(11, 61, 92, 0.12);
      color: var(--yonah-navy);
      font-weight: 800;
    }

    [data-theme="dark"] .sec-link-btn.active {
      background: rgba(212, 162, 76, 0.2);
      color: var(--yonah-gold);
    }

    /* ZONE PRINCIPALE DE LECTURE */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .content-scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 6rem;
      scroll-behavior: smooth;
    }

    .container-reading {
      max-width: 860px;
      margin: 0 auto;
    }

    /* BARRE INFÉRIEURE STICKY */
    .bottombar-sticky {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
      z-index: 40;
    }

    .btn-nav-touch {
      min-width: 110px;
      height: 44px;
      padding: 0 1rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.88rem;
      border: 1px solid var(--border);
      color: var(--text-main);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-nav-touch.primary {
      background: var(--yonah-navy);
      color: var(--text-on-dark);
      border-color: var(--yonah-navy);
    }

    [data-theme="dark"] .btn-nav-touch.primary {
      background: var(--yonah-gold);
      color: var(--yonah-navy-dark);
      border-color: var(--yonah-gold);
    }

    .btn-nav-touch:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .nav-pos-center {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* FICHES BILINGUES OBLIGATOIRES */
    .def-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--yonah-gold);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.4rem;
      margin: 1.25rem 0;
      box-shadow: var(--shadow-sm);
    }

    .def-card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--yonah-navy);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    [data-theme="dark"] .def-card-title {
      color: var(--yonah-gold);
    }

    .def-row {
      margin-bottom: 0.6rem;
      font-size: 0.93rem;
      line-height: 1.6;
    }

    .def-label {
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-main);
    }

    .def-label.expert { color: var(--yonah-navy-light); }
    .def-label.simple { color: var(--yonah-emerald); }
    .def-label.example { color: var(--yonah-gold-dark); }

    [data-theme="dark"] .def-label.expert { color: #93c5fd; }
    [data-theme="dark"] .def-label.simple { color: #34d399; }
    [data-theme="dark"] .def-label.example { color: #fbbf24; }

    /* ENCADRÉS SCIENTIFIQUES */
    .box-callout {
      border-radius: var(--radius-md);
      padding: 1.25rem 1.4rem;
      margin: 1.5rem 0;
      border-left: 5px solid transparent;
      box-shadow: var(--shadow-sm);
    }

    .box-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .box-key {
      background: rgba(11, 61, 92, 0.08);
      border-left-color: var(--yonah-navy);
    }
    .box-key .box-header { color: var(--yonah-navy); }
    [data-theme="dark"] .box-key { background: rgba(11, 61, 92, 0.3); border-left-color: #3b82f6; }
    [data-theme="dark"] .box-key .box-header { color: #93c5fd; }

    .box-warning {
      background: var(--yonah-danger-light);
      border-left-color: var(--yonah-danger);
    }
    .box-warning .box-header { color: var(--yonah-danger); }
    [data-theme="dark"] .box-warning { background: rgba(197, 48, 48, 0.2); }

    .table-science {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.9rem;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .table-science th, .table-science td {
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    .table-science th {
      background: var(--yonah-navy);
      color: white;
      font-weight: 700;
    }

    [data-theme="dark"] .table-science th {
      background: #103753;
      color: var(--yonah-gold);
    }

    .table-science tr:nth-child(even) {
      background: var(--surface-subtle);
    }

    .tool-widget {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 2rem 0;
      box-shadow: var(--shadow-md);
    }

    /* CAS PRATIQUES */
    .case-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 2rem 0;
      box-shadow: var(--shadow-md);
    }

    .case-badge-banner {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--yonah-navy);
      color: var(--yonah-gold);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    .case-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.6rem;
      color: var(--text-main);
    }

    .case-desc {
      background: var(--surface-subtle);
      padding: 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .case-textarea {
      width: 100%;
      height: 100px;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-main);
      margin-bottom: 0.75rem;
      resize: vertical;
    }

    .case-expert-reveal {
      background: var(--yonah-emerald-light);
      border: 1px solid var(--yonah-emerald);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-top: 1rem;
    }

    [data-theme="dark"] .case-expert-reveal {
      background: rgba(14, 124, 102, 0.2);
    }

    /* CERTIFICAT OFFICIEL INFALSIFIABLE */
    .cert-wrap {
      background: #FFFFFF;
      color: #062335;
      border: 10px double #D4A24C;
      border-radius: var(--radius-md);
      padding: 3rem 2rem;
      margin: 2rem auto;
      max-width: 780px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    .cert-seal-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
    }

    .cert-title-huge {
      font-size: 1.8rem;
      font-weight: 900;
      color: #0B3D5C;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .cert-sub-text {
      font-size: 0.9rem;
      font-weight: 700;
      color: #D4A24C;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
    }

    .cert-recipient {
      font-size: 2rem;
      font-weight: 900;
      color: #062335;
      margin: 1rem 0;
      border-bottom: 2px solid #D4A24C;
      display: inline-block;
      padding: 0 2rem 0.3rem;
    }

    .cert-statement {
      max-width: 660px;
      margin: 0 auto 2rem;
      font-size: 0.98rem;
      line-height: 1.6;
      color: #2D3748;
    }

    .cert-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      border-top: 1px solid #E2DBD0;
      padding-top: 1.5rem;
      font-size: 0.85rem;
      text-align: left;
    }

    .cert-signature-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.5rem;
    }

    .cert-sig-svg {
      width: 140px;
      height: 50px;
    }

    .cheat-alert-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .cheat-alert-card {
      background: var(--surface);
      max-width: 640px;
      width: 100%;
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: left;
      border: 3px solid var(--yonah-navy);
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (max-width: 767px) {
      .sidebar {
        position: fixed;
        top: 60px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        width: 85%;
        max-width: 320px;
        box-shadow: var(--shadow-lg);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        top: 60px;
        background: rgba(6, 35, 53, 0.6);
        z-index: 40;
        display: none;
      }

      .sidebar-backdrop.active {
        display: block;
      }

      .cert-meta-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    @media (min-width: 768px) {
      .menu-hamburger-btn {
        display: none;
      }
    }

    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .topbar, .sidebar, .bottombar-sticky, .toast, .btn-print-hide, .home-cta-row, .cheat-alert-modal {
        display: none !important;
      }
      #appWrapper, .main-area, .content-scrollable {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
      }
      .cert-wrap {
        border-width: 5px !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div id="appWrapper">
    <div id="sideBackdrop" class="sidebar-backdrop" onclick="app.closeSidebar()"></div>

  <script>

      INTERMEDIAIRE: { name: "🟡 NIVEAU 2 — INTERMÉDIAIRE", range: "Modules 9 à 16", duration: "15–20 h", focus: "Application : ATC, classes thérapeutiques, interactions, visite médicale" },
      AVANCE: { name: "🟠 NIVEAU 3 — AVANCÉ", range: "Modules 17 à 24", duration: "15–20 h", focus: "Maîtrise : argumentaire EBM, territoire, KOL, éthique, CRM, veille" },
      EXPERT: { name: "🔴 NIVEAU 4 — EXPERT", range: "Modules 25 à 30", duration: "12–18 h", focus: "Excellence : leadership, mentorat, crise, stratégie, certification finale" },
      TRACKS: { name: "🎯 ÉTAGE 2 — TRACKS DE SPÉCIALISATION", range: "8 Tracks d'Élite", duration: "20–30 h", focus: "Spécialisations : Vaccins, Dispositifs médicaux, OTC/Dermo, MSL, Santé publique, Marchés publics" }
    };

    const INSTITUTIONAL_INFO = {"about":{"title":"À propos de l'Institut d'Excellence Yonah","location":"Abidjan, Côte d'Ivoire (Plateau & Cocody)","mission":"Former l'élite des délégués médicaux, responsables grands comptes et cadres pharmaceutiques d'Afrique subsaharienne par une alliance unique entre rigueur scientifique médicale internationale, excellence éthique et immersion clinique réelle.","stats":[{"label":"Taux d'insertion professionnelle sous 6 mois","value":"96.4%"},{"label":"Modules certifiants & Spécialisations","value":"30 Modules + 8 Tracks"},{"label":"Durée d'immersion clinique hospitalière","value":"4 semaines en CHU"},{"label":"Laboratoires & Grossistes partenaires","value":"45+ Entreprises"}],"immersion":"Chaque lauréat Yonah effectue un stage clinique d'immersion hospitalière obligatoire de 4 semaines au sein des services de cardiologie, pédiatrie, réanimation et pharmacie hospitalière (CHU de Cocody, Treichville, Yopougon ou Bouaké) pour comprendre intimement le quotidien des soignants et la détresse des malades.","ethics":"Tolérance zéro contre la corruption. Les diplômés Yonah s'engagent par serment à promouvoir le Bon Usage du Médicament, à respecter le secret médical et à ne jamais monnayer d'actes de prescription.","accreditation":"Certificats professionnels vérifiables par empreinte cryptographique SHA-256 unique et registre numérique public décentralisé."},"committee":[{"name":"Pr. Augustin KONAN","title":"Président du Conseil Scientifique","role":"Professeur Titulaire de Pharmacologie Clinique, Faculté de Pharmacie d'Abidjan","bio":"Ancien doyen, expert international en pharmacocinétique et membre des comités d'experts de l'OMS."},{"name":"Dr. Marie-Hélène BROU","title":"Vice-Présidente aux Affaires Pédagogiques","role":"Praticienne Hospitalière, Chef de Service de Cardiologie CHU de Treichville","bio":"Spécialiste de l'hypertension artérielle du sujet mélanoderme et des pathologies vasculaires en Afrique."},{"name":"Dr. Yves-Alain DIOMANDÉ","title":"Directeur de la Déontologie & Régulation","role":"Pharmacien Inspecteur, Ancien Directeur de la Régulation Pharmaceutique (AIRP)","bio":"Expert des dossiers d'homologation CTD, de la pharmacovigilance et des inspections BPF/BPD."},{"name":"Dr. Fatoumata BENGALY","title":"Directrice du Pôle Infectiologie & Santé Publique","role":"Infectiologue et Épidémiologiste, Consultante auprès du Fonds Mondial","bio":"Spécialiste des stratégies de déploiement des CTA antipaludiques et de l'antibiogouvernance hospitalière."},{"name":"M. Christian AKLÉ","title":"Directeur de l'Insertion Professionnelle & Partenariats","role":"Ancien Directeur Général de Laboratoire Multinational pour l'Afrique de l'Ouest","bio":"Plus de 25 ans de direction commerciale, spécialiste du management des forces de vente et des relations avec les grossistes répartiteurs."}]};
    const YONAH_COURSE_DATA = [{"id":1,"tier":"DEBUTANT","badge":"Module 1","title":"Module 1 : Le métier de délégué médical : découverte et vocation","objective":"Comprendre le statut de délégué médical, ses 3 missions piliers (information, bon usage, pharmacovigilance), son périmètre déontologique et une journée type sur le terrain ouest-africain.","sections":[{"id":"m1-s1","title":"1.1 Qu'est-ce qu'un délégué médical ? Définition, rôle et statut","html":"\n          <div class=\"box-callout box-key\">\n            <div class=\"box-header\">Statut et mission institutionnelle</div>\n            <p>Le <strong>délégué médical</strong> (ou représentant médical) est un <em>professionnel assermenté de l'information promotionnelle et scientifique</em>. Il constitue le trait d'union scientifique incontournable entre les équipes de recherche & développement des laboratoires pharmaceutiques et les praticiens de terrain (médecins, pharmaciens, chirurgiens-dentistes, sages-femmes).</p>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 1 : Délégué Médical (Représentant Médical)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Professionnel de santé ou scientifique diplômé mandaté par un laboratoire pour assurer la promotion éthique et la diffusion d'informations médicales objectives sur des spécialités pharmaceutiques, conformément à l'Autorisation de Mise sur le Marché (AMM) et aux Bonnes Pratiques de Promotion Médicale.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> C'est le messager de confiance du médicament : il explique aux médecins à quoi sert le produit, chez quel patient le donner, comment l'utiliser en sécurité et à quel moment l'éviter.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> À Abidjan, un délégué visite un cardiologue au CHU de Treichville pour lui présenter les données cliniques de tolérance d'une nouvelle bithérapie antihypertensive chez le patient âgé.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 2 : Bon Usage du Médicament (BUM)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Utilisation rationnelle du médicament conforme aux données de la science, au Résumé des Caractéristiques du Produit (RCP) et aux recommandations de santé publique, visant à maximiser le bénéfice thérapeutique tout en minimisant les risques iatrogènes.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Donner le bon médicament, à la bonne personne, à la bonne dose, par la bonne voie et pour la bonne durée.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Rappeler qu'un antibiotique pour une sinusite aiguë doit être suivi durant 7 jours stricts sans interruption prématurée dès la disparition de la fièvre.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 3 : Pharmacovigilance Active</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Ensemble des procédures de surveillance continue, d'évaluation, de compréhension et de prévention du risque d'effets indésirables ou de tout autre problème lié à l'utilisation des médicaments après leur mise sur le marché.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le rôle de vigie sanitaire : si un médecin signale un effet inattendu ou grave chez un patient, le délégué le transmet immédiatement au laboratoire pour protéger les autres malades.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Une remontée de cas de rash cutané sévère après ingestion d'un antipaludique transmise sous 24 heures au responsable de pharmacovigilance en Côte d'Ivoire.</div>\n          </div>\n        "},{"id":"m1-s2","title":"1.2 Déontologie, cadre légal et ce que le délégué ne fait jamais","html":"\n          <p>Le délégué médical d'excellence de l'Institut Yonah est un modèle d'intégrité. Il est tenu au strict respect de la déontologie pharmaceutique internationale et des textes de l'<strong>AIRP</strong> (Autorité Ivoirienne de Régulation Pharmaceutique).</p>\n          \n          <div class=\"box-callout box-warning\">\n            <div class=\"box-header\">Les interdits absolus de la profession</div>\n            <ul style=\"margin-left: 1.25rem; line-height: 1.7;\">\n              <li><strong>Jamais de vente directe de boîtes :</strong> Le délégué ne vend rien au patient et n'encaisse aucun argent. Le circuit de dispensation appartient exclusivement aux officines et pharmacies hospitalières.</li>\n              <li><strong>Jamais de marchandage de prescription :</strong> Interdiction totale de proposer des espèces, enveloppes, cadeaux de valeur ou avantages matériels en échange d'un quota d'ordonnances.</li>\n              <li><strong>Jamais de promotion hors-AMM (Off-label) :</strong> Il est pénalement interdit de promouvoir des indications thérapeutiques non validées par les autorités sanitaires.</li>\n              <li><strong>Jamais de dénigrement des confrères et concurrents :</strong> Le débat se fait uniquement sur la base de données cliniques publiées et vérifiables (Evidence-Based Medicine).</li>\n            </ul>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 4 : Promotion Hors-AMM (Off-Label)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Allégation ou incitation commerciale relative à des indications, posologies, populations cibles ou voies d'administration non mentionnées dans l'AMM légale délivrée par l'autorité réglementaire.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Vendre une voiture en affirmant qu'elle peut naviguer comme un bateau : c'est vanter un usage que les scientifiques et l'État n'ont jamais validé.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Promouvoir un antidiabétique injectable injectable chez une adolescente non diabétique uniquement dans un but de perte de poids esthétique sans AMM obésité.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 5 : Secret Médical Partagé</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Obligation légale et morale de confidentialité interdisant à toute personne en contact avec l'environnement médical de consulter, divulguer ou exploiter des données d'identification ou des diagnostics de patients.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Ce qui est vu ou entendu dans un cabinet médical (dossiers sur le bureau, confidences) reste un secret absolu et inviolable.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Détourner immédiatement le regard et ne jamais lire les fiches patients étalées sur la table du médecin lors d'un entretien.</div>\n          </div>\n        "},{"id":"m1-case","title":"1.8 Cas pratique : Première journée d'un délégué médical sur son secteur","isCase":true,"caseId":"c1","caseContext":"M. Kouamé, jeune lauréat Yonah, commence son activité de délégué à Cocody et Plateau. Il dispose de sa sacoche, de fiches produits validées et d'une liste de 10 médecins sans rendez-vous. Il constate qu'à la clinique Sainte-Anne, la salle d'attente est bondée de 15 patients en détresse.","caseProblem":"Que doit faire Kouamé pour établir un contact professionnel durable sans compromettre l'éthique ni bloquer le travail de consultation du médecin ?","expertAnswer":"1) Se présenter à la secrétaire médicale avec courtoisie et déférence, en précisant qu'il est délégué médical Yonah pour le laboratoire X. 2) Expliquer qu'il ne souhaite en aucun cas retarder la prise en charge des patients souffrants et demander quel créneau est le plus opportun (fin de consultation de midi ou 17h30). 3) Laisser une carte de visite professionnelle et un mot manuscrit respectueux pour le praticien. 4) Exploiter le créneau libre pour visiter 2 officines de proximité afin de vérifier la disponibilité en stock des molécules du laboratoire.","keyTakeaways":"Le respect absolu du temps de consultation et la bienveillance envers l'équipe d'accueil sont les piliers indétrônables de la réputation d'un délégué."},{"id":"m1-quiz","title":"1.9 Mini-Quiz d'évaluation : Module 1","isQuiz":true,"quizModuleId":1}]},{"id":2,"tier":"DEBUTANT","badge":"Module 2","title":"Module 2 : Le système de santé et le circuit du médicament","objective":"Maîtriser les circuits de fabrication, importation, distribution en gros et dispensation au détail, ainsi que les modèles de financement de la santé.","sections":[{"id":"m2-s1","title":"2.1 Les grands systèmes de santé et la couverture maladie","html":"\n          <p>Un système de santé regroupe l'ensemble des organisations, institutions et ressources consacrées à l'amélioration, au rétablissement et au maintien de la santé des populations.</p>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 6 : Couverture Maladie Universelle (CMU)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Dispositif national de protection sociale garantissant à l'ensemble de la population d'un pays l'accès à un panier de soins de santé essentiels et à des médicaments de qualité sans subir de ruine financière.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Une assurance collective où chacun cotise selon ses moyens pour que tout citoyen puisse se soigner et acheter ses ordonnances à coût réduit.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> En Côte d'Ivoire, la CNAM gère la CMU qui prend en charge 70% du tarif de référence des médicaments traceurs conventionnés.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 7 : Grossiste-Répartiteur Pharmaceutique</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Entreprise commerciale pharmaceutique agréée assurant l'achat, le stockage sécurisé sous température contrôlée et la distribution logistique quotidienne d'un assortiment complet de médicaments auprès des officines et établissements de santé.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le grand magasin central qui approvisionne chaque jour les pharmacies de quartier pour qu'aucun médicament ne manque.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Les acteurs majeurs du marché ivoirien : COPHARMED, LABOREX-CI, DPCI et TEDIS PHARMA.</div>\n          </div>\n        "},{"id":"m2-s2","title":"2.2 Du laboratoire à l'officine : La chaîne logistique et Bonnes Pratiques","html":"\n          <div class=\"box-callout box-key\">\n            <div class=\"box-header\">La chaîne de distribution du médicament</div>\n            <p>1. <strong>Fabricant certifié BPF</strong> (Bonnes Pratiques de Fabrication) -> 2. <strong>Laboratoire / Agence d'importation</strong> -> 3. <strong>Dépôt central sous douane</strong> -> 4. <strong>Grossiste répartiteur</strong> -> 5. <strong>Pharmacie d'officine / PUI hospitalière</strong> -> 6. <strong>Patient</strong>.</p>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 8 : Bonnes Pratiques de Distribution (BPD)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Référentiel normatif international imposant des standards rigoureux de traçabilité, de propreté et de maintien de la chaîne du froid lors du transport et de l'entreposage des spécialités pharmaceutiques.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Les règles obligatoires pour s'assurer que le médicament ne prend pas un coup de chaud ou d'humidité dans le camion de livraison.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Vérification des pastilles thermo-sensibles d'un carton d'insulines livré à une pharmacie de Korhogo en pleine saison sèche.</div>\n          </div>\n        "},{"id":"m2-case","title":"2.8 Cas pratique : Alerte de rupture de stock chez un grossiste répartiteur","isCase":true,"caseId":"c2","caseContext":"Le Dr Bamba, cardiologue influent à Yopougon, appelle furieux le délégué médical : ses trois derniers patients n'ont pas trouvé leur traitement antihypertenseur d'urgence dans les 4 pharmacies entourant sa clinique.","caseProblem":"Comment le délégué doit-il intervenir méthodiquement pour rétablir la situation sans accuser autrui ?","expertAnswer":"1) Remercier le praticien pour l'alerte et noter les 4 officines concernées. 2) Se rendre immédiatement auprès du service approvisionnement des 2 grossistes locaux (ex. LABOREX et DPCI) pour vérifier l'état du stock central (rupture réelle usine ou rupture de réassort ponctuelle). 3) Si le stock est disponible chez un répartiteur, solliciter un dépannage express d'urgence pour les 4 officines ciblées. 4) Rappeler le Dr Bamba dans les 2 heures pour lui confirmer que les boîtes sont arrivées sur les rayons des pharmacies partenaires.","keyTakeaways":"Le délégué ne se contente pas de faire prescrire : il sécurise l'accessibilité physique du médicament pour le patient."},{"id":"m2-quiz","title":"2.9 Mini-Quiz d'évaluation : Module 2","isQuiz":true,"quizModuleId":2}]},{"id":3,"tier":"DEBUTANT","badge":"Module 3","title":"Module 3 : Le médicament : formes galéniques, origines et voies d'administration","objective":"Comprendre les composants d'un médicament (PA et excipients), les différentes origines de synthèse ou biotechnologie, les voies d'administration et leurs implications cliniques.","sections":[{"id":"m3-s1","title":"3.1 Principe Actif, Excipients et Formes Galéniques","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 9 : Principe Actif (Substance Active)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Molécule d'origine chimique, biologique, végétale ou minérale dotée d'une activité pharmacologique spécifique responsable de l'effet thérapeutique ou préventif du médicament.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> C'est le soldat qui combat la maladie dans le comprimé (par exemple le paracétamol dans une boîte de comprimés).</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'artéméther est le principe actif antiparasitaire qui détruit les formes sanguines de Plasmodium falciparum.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 10 : Excipient à Effet Notoire (EEN)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Substance auxiliaire dépourvue d'effet thérapeutique mais dont la présence peut induire une réaction indésirable ou être contre-indiquée chez des populations hypersensibles (lactose, aspartame, gluten, alcool benzylique).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Les ingrédients secondaires (goût, conservation, couleur) qui peuvent parfois provoquer une allergie ou une intolérance chez certains patients.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Le sirop contre la toux contenant du sorbitol ou du saccharose, déconseillé ou à surveiller chez le patient diabétique.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 11 : Galénique (Formulation)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Art et science pharmaceutique de mise en forme des substances actives et adjuvants pour créer une forme d'administration assurant stabilité, précision du dosage et biodisponibilité optimale.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> L'emballage intelligent du principe actif : en gélule, en comprimé effervescent, en spray ou en sirop pour qu'il s'avale facilement et agisse au bon endroit.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Un comprimé à libération prolongée (LP) qui diffuse son principe actif sur 24 heures pour éviter au patient hypertendu de prendre 3 prises par jour.</div>\n          </div>\n        "},{"id":"m3-s2","title":"3.2 Comparatif des Voies d'administration","html":"\n          <table class=\"table-science\">\n            <thead>\n              <tr><th>Voie d'administration</th><th>Avantages majeurs</th><th>Inconvénients & Limites</th><th>Exemples cliniques</th></tr>\n            </thead>\n            <tbody>\n              <tr>\n                <td><strong>Orale (Per os)</strong></td>\n                <td>Non invasive, économique, autonome pour le patient.</td>\n                <td>Premier passage hépatique, dégradation gastrique, début d'action différé (30-60 min).</td>\n                <td>Comprimés d'antalgiques, gélules d'antibiotiques.</td>\n              </tr>\n              <tr>\n                <td><strong>Intraveineuse (IV)</strong></td>\n                <td>Biodisponibilité 100%, action foudroyante, contrôle posologique instantané.</td>\n                <td>Invasive, risque infectieux/sepsis, irréversible, nécessite matériel et personnel formé.</td>\n                <td>Artésunate injectable dans le paludisme grave, perfusion d'antibiotiques hospitaliers.</td>\n              </tr>\n              <tr>\n                <td><strong>Inhalée</strong></td>\n                <td>Action pulmonaire locale rapide, faible passage dans le sang (effets indésirables réduits).</td>\n                <td>Nécessite une synchronisation main-poumon ou une chambre d'inhalation.</td>\n                <td>Aérosols doseurs de Salbutamol dans la crise d'asthme.</td>\n              </tr>\n              <tr>\n                <td><strong>Sublinguale</strong></td>\n                <td>Absorption vasculaire ultra-rapide par le plexus veineux sous la langue, court-circuite le foie.</td>\n                <td>Goût parfois désagréable, surface d'absorption limitée aux petites doses.</td>\n                <td>Dérivés nitrés dans l'angine de poitrine (crise d'angor).</td>\n              </tr>\n            </tbody>\n          </table>\n        "},{"id":"m3-case","title":"3.8 Cas pratique : Adaptation galénique en pédiatrie","isCase":true,"caseId":"c3","caseContext":"Dans un centre de santé urbain, une mère tente de donner un demi-comprimé d'antibiotique écrasé dans de l'eau à son enfant de 14 mois. L'enfant s'étouffe, recrache et refuse catégoriquement la mixture amère.","caseProblem":"Que proposez-vous lors de votre staff médical au pédiatre ?","expertAnswer":"Expliquer l'intérêt de la forme suspension buvable pédiatrique en flacon avec pipette graduée en kilogrammes de poids corporel. La molécule y est enrobée pour masquer l'amertume et aromatisée. L'administration à la commissure des lèvres évite les fausses routes et garantit l'administration intégrale de la dose thérapeutique prescrite.","keyTakeaways":"Le choix de la bonne forme galénique conditionne directement l'observance et le succès thérapeutique chez l'enfant."},{"id":"m3-quiz","title":"3.9 Mini-Quiz d'évaluation : Module 3","isQuiz":true,"quizModuleId":3}]},{"id":4,"tier":"DEBUTANT","badge":"Module 4","title":"Module 4 : Le cycle de vie du médicament : de la recherche au RCP","objective":"Comprendre les 4 phases des essais cliniques, les critères d'AMM, et savoir décrypter un Résumé des Caractéristiques du Produit (RCP).","sections":[{"id":"m4-s1","title":"4.1 Les 4 Phases des Essais Cliniques de Développement","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 12 : Essai Contrôlé Randomisé (ECR) en Double Insu</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Étude expérimentale comparative où les patients sont attribués par tirage au sort (randomisation) soit au bras traitement expérimental soit au bras témoin (placebo ou référence), sans que ni le patient ni le médecin évaluateur ne connaissent l'attribution (double insu).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le test suprême d'objectivité : personne ne sait qui reçoit le vrai médicament pour éliminer toute influence psychologique.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'essai pivot de phase III démontrant la supériorité d'une nouvelle trithérapie antirétrovirale face au traitement standard.</div>\n          </div>\n\n          <table class=\"table-science\">\n            <thead>\n              <tr><th>Phase</th><th>Population testée</th><th>Objectif principal</th><th>Taille de cohorte</th></tr>\n            </thead>\n            <tbody>\n              <tr><td><strong>Phase I</strong></td><td>Volontaires sains (ou malades en cancérologie)</td><td>Tolérance, toxicité, pharmacocinétique initiale.</td><td>20 à 80 sujets</td></tr>\n              <tr><td><strong>Phase II</strong></td><td>Patients malades ciblés</td><td>Efficacité préliminaire, détermination de la dose optimale.</td><td>100 à 300 patients</td></tr>\n              <tr><td><strong>Phase III</strong></td><td>Grande cohorte de patients multicentrique</td><td>Démonstration formelle de supériorité/non-infériorité vs comparateur.</td><td>1 000 à 5 000+ patients</td></tr>\n              <tr><td><strong>Phase IV</strong></td><td>Population réelle post-AMM</td><td>Surveillance à long terme en vie réelle (pharmacovigilance, RWE).</td><td>Dizaines de milliers</td></tr>\n            </tbody>\n          </table>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 13 : Résumé des Caractéristiques du Produit (RCP)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Document médico-légal officiel validé par l'autorité de réglementation pharmaceutique lors de l'octroi de l'AMM, décrivant de manière exhaustive et scientifiquement prouvée les indications, contre-indications, posologies et profils d'effets secondaires de la molécule.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> La carte d'identité juridique et médicale officielle du médicament : tout ce que le délégué dit au médecin doit être conforme au mot près à ce document.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> La rubrique 4.3 du RCP d'un AINS qui liste formellement l'ulcère gastrique évolutif et le 3e trimestre de grossesse comme contre-indications absolues.</div>\n          </div>\n        "},{"id":"m4-case","title":"4.8 Cas pratique : Interprétation d'un RCP face à une demande hors-AMM","isCase":true,"caseId":"c4","caseContext":"Un médecin ORL demande au délégué médical si son collyre oculaire antibiotique peut être instillé dans l'oreille pour soigner une otite externe chez un adolescent.","caseProblem":"Que doit répondre le délégué médical en s'appuyant sur le RCP ?","expertAnswer":"Le délégué consulte mentalement le RCP : la rubrique 4.1 n'indique que les affections ophtalmiques. Il répond avec respect : 'Docteur, le RCP validé de notre spécialité ne mentionne aucune indication auriculaire. De plus, les excipients et le pH de cette solution ophtalmique n'ont pas été formulés pour la sphère tympanique, notamment en cas de tympan perforé où un risque d'ototoxicité existe. Notre laboratoire ne peut donc recommander cet usage hors-AMM et préconise l'utilisation d'une goutte auriculaire spécifiquement enregistrée pour cette indication.'","keyTakeaways":"Le délégué ne transige jamais avec le périmètre légal du RCP : il protège le médecin de la faute médico-légale."},{"id":"m4-quiz","title":"4.9 Mini-Quiz d'évaluation : Module 4","isQuiz":true,"quizModuleId":4}]},{"id":5,"tier":"DEBUTANT","badge":"Module 5","title":"Module 5 : Le corps humain : anatomie et physiologie pour le délégué","objective":"Acquérir les bases indispensables de physiologie cardiovasculaire, rénale, hépatique, respiratoire et du système nerveux autonome pour dialoguer d'égal à égal avec les médecins.","sections":[{"id":"m5-s1","title":"5.1 Les Grands Systèmes Organiques et Cibles Thérapeutiques","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 14 : Filtration Glomérulaire (DFG)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Volume de liquide filtré par les glomérules rénaux par unité de temps (normalement ≥ 90 mL/min/1.73m²), constituant le marqueur physiologique fondamental de la fonction d'épuration rénale.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le débit de nettoyage des reins : plus ce chiffre baisse en dessous de 60, plus les reins peinent à éliminer les toxines et les médicaments.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Un patient diabétique dont le DFG est tombé à 35 mL/min nécessite une baisse de posologie de la metformine pour prévenir une acidose lactique.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 15 : Système Nerveux Végétatif (Autonome)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Partie du système nerveux régulant les fonctions viscérales involontaires (rythme cardiaque, bronchomotricité, sécrétions, digestion), subdivisée en système sympathique (adrénergique) et système parasympathique (cholinergique).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le pilote automatique du corps : le sympathique accélère le cœur et prépare à l'action ; le parasympathique ralentit et favorise le repos et la digestion.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Les bêtabloquants freinent le système sympathique pour soulager un cœur hypertendu ou fatigué.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 16 : Effet de Premier Passage Hépatique</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Métabolisation présystémique précoce d'une molécule par les enzymes des hépatocytes lors de son transit initial entre l'absorption intestinale et la circulation générale via la veine porte.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le péage obligatoire du foie : avant de circuler dans tout le corps, le médicament avalé passe par le foie qui en détruit parfois une grande partie.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> La trinitrine orale est détruite à plus de 90% par le foie ; c'est pourquoi on la donne sous la langue pour qu'elle passe directement dans le sang.</div>\n          </div>\n        "},{"id":"m5-case","title":"5.4 Cas pratique : Comprendre l'impact d'une cirrhose sur la posologie","isCase":true,"caseId":"c5","caseContext":"Un médecin de médecine interne hésite à prescrire un sédatif métabolisé par le foie chez un patient ayant une cirrhose post-hépatite B avec ascite.","caseProblem":"Comment le délégué explique-t-il la modification pharmacocinétique induite par l'atteinte hépatique ?","expertAnswer":"Le délégué rappelle que chez le cirrhotique : 1) Le nombre d'hépatocytes fonctionnels est drastiquement réduit, ce qui effondre l'activité des cytochromes P450 et allonge considérablement la demi-vie d'élimination. 2) La synthèse d'albumine est effondrée, ce qui augmente la fraction libre active toxique du médicament dans le sang. 3) Il convient d'alerter sur le risque d'encéphalopathie hépatique et de suggérer une molécule à élimination rénale prédominante ou une réduction posologique drastique.","keyTakeaways":"Le bon délégué maîtrise la physiopathologie pour guider la prescription chez les patients fragilisés."},{"id":"m5-quiz","title":"5.5 Mini-Quiz d'évaluation : Module 5","isQuiz":true,"quizModuleId":5}]},{"id":6,"tier":"DEBUTANT","badge":"Module 6","title":"Module 6 : La maladie : causes, diagnostic et classification CIM-11","objective":"Comprendre les processus pathologiques (infectieux, métaboliques, dégénératifs), les signes cliniques, le raisonnement diagnostique et la CIM-11 de l'OMS.","sections":[{"id":"m6-s1","title":"6.1 Processus morbides et classification internationale CIM-11","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 17 : CIM-11 (Classification Internationale des Maladies)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Onzième révision du standard mondial de l'Organisation Mondiale de la Santé codifiant de manière systématique l'ensemble des pathologies, traumatismes et motifs de recours aux soins pour des fins épidémiologiques et statistiques.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le dictionnaire mondial officiel où chaque maladie possède un code unique compris par tous les médecins de la planète.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Le codage du paludisme à Plasmodium falciparum non compliqué permettant aux ministères de la santé de suivre l'incidence épidémique.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 18 : Comorbidité et Polypathologie</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Coexistence chez un même individu d'un ou plusieurs troubles ou pathologies chroniques venant s'ajouter à une pathologie initiale, modifiant le pronostic et complexifiant la prise en charge thérapeutique.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Avoir plusieurs maladies chroniques en même temps (par exemple être hypertendu ET diabétique ET avoir du cholestérol).</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Un patient de 60 ans combinant diabète de type 2, HTA de grade 2 et néphropathie débutante, cas classique en consultation de cardiologie à Abidjan.</div>\n          </div>\n        "},{"id":"m6-case","title":"6.6 Cas pratique : Analyse d'une ordonnance complexe de polypathologique","isCase":true,"caseId":"c6","caseContext":"Une ordonnance présentée en officine comprend : Amlodipine 10mg (1x/j), Ramipril 5mg (1x/j), Metformine 1000mg (2x/j), Atorvastatine 20mg (1x/j au coucher), et Acide Acétylsalicylique 100mg (1x/j midi).","caseProblem":"Quel est le diagnostic physiopathologique sous-jacent complet de ce patient ?","expertAnswer":"Il s'agit d'un patient présentant un syndrome métabolique complet à très haut risque cardiovasculaire : diabète de type 2 (metformine), hypertension artérielle sévère nécessitant une bithérapie anticalcique + IEC (amlodipine + ramipril), dyslipidémie athérogène (atorvastatine) et prévention secondaire ou primaire renforcée des accidents thrombotiques (aspirine à faible dose).","keyTakeaways":"Savoir lire entre les lignes d'une ordonnance permet d'identifier immédiatement le profil clinique du patient."},{"id":"m6-quiz","title":"6.7 Mini-Quiz d'évaluation : Module 6","isQuiz":true,"quizModuleId":6}]},{"id":7,"tier":"DEBUTANT","badge":"Module 7","title":"Module 7 : Pharmacologie I : Pharmacocinétique (Modèle ADME)","objective":"Maîtriser les 4 phases de l'ADME, la biodisponibilité, le volume de distribution, la clairance, la demi-vie T1/2 et utiliser le calculateur cinétique.","sections":[{"id":"m7-s1","title":"7.1 Les 4 étapes fondamentales de la pharmacocinétique","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 19 : Pharmacocinétique (Ce que le corps fait au médicament)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Étude quantitative en fonction du temps du devenir d'un xénobiotique dans l'organisme, englobant les processus d'Absorption, Distribution, Métabolisme et Élimination (ADME).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le voyage du médicament dans notre corps : comment il entre, où il va, comment il est transformé et comment il en sort.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Mesurer à quelle heure le paracétamol atteint sa concentration maximale dans le sang après ingestion d'un sachet.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 20 : Biodisponibilité (F)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Fraction de la dose administrée de principe actif qui atteint la circulation sanguine générale sous forme inchangée, ainsi que la vitesse à laquelle ce processus s'effectue.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le pourcentage réel de médicament qui arrive vivant et intact dans le sang. Par intraveineuse, il est toujours de 100%.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Une molécule orale avec une biodisponibilité de 50% signifie que sur 100 mg avalés, seuls 50 mg atteindront la circulation générale.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 21 : Demi-vie d'élimination (T1/2)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Temps nécessaire pour que la concentration plasmatique d'un principe actif diminue de moitié lors de la phase d'élimination terminale de l'organisme.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le temps que met le corps pour nettoyer la moitié de la quantité de médicament présente dans le sang.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Une molécule avec une demi-vie de 24h permet une prise unique par jour, évitant les oublis de prises chez les hypertendus.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 22 : État d'Équilibre (Steady-State)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Situation pharmacocinétique stationnaire atteinte lors d'administrations répétées à intervalles réguliers, où la vitesse d'élimination égale la vitesse d'administration (environ 5 demi-vies).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le plateau thérapeutique : quand le niveau de médicament dans le sang reste stable et efficace nuit et jour.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Pour un antidépresseur ayant une T1/2 de 24h, il faut 5 jours complets (5 x 24h) pour que sa concentration sanguine se stabilise au niveau cible.</div>\n          </div>\n        "},{"id":"m7-tool","title":"7.2 Simulateur Clinique de Demi-vie et d'Élimination","isAdmeTool":true,"html":"\n          <div class=\"tool-widget\">\n            <h4 style=\"color:var(--yonah-navy); margin-bottom:0.75rem; font-size:1.15rem; font-weight:800;\">\n              Calculateur Clinique de Demi-vie T1/2 & État d'Équilibre\n            </h4>\n            <p style=\"font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;\">\n              Saisissez la demi-vie d'élimination de votre molécule pour simuler instantanément le temps requis pour atteindre le plateau thérapeutique (Steady-State) et l'élimination totale (>99%).\n            </p>\n            <div style=\"display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem;\">\n              <label style=\"font-weight:700; font-size:0.95rem;\">Demi-vie T1/2 (en heures) :</label>\n              <input type=\"number\" id=\"calcT12Input\" value=\"12\" min=\"1\" max=\"200\" style=\"padding:0.5rem 0.75rem; width:100px; border-radius:var(--radius-sm); border:1px solid var(--border); font-weight:800; text-align:center;\">\n              <button class=\"btn-nav-touch primary\" onclick=\"app.runAdmeCalc()\">Calculer les paramètres</button>\n            </div>\n            <div id=\"admeCalcResult\" style=\"background:var(--surface-subtle); padding:1rem; border-radius:var(--radius-md); border-left:4px solid var(--yonah-gold); font-size:0.92rem; line-height:1.6;\">\n              Cliquez sur \"Calculer\" pour afficher l'analyse cinétique.\n            </div>\n          </div>\n        "},{"id":"m7-case","title":"7.5 Cas pratique : Argumenter sur une T1/2 longue face à un médecin pressé","isCase":true,"caseId":"c7","caseContext":"Le Dr Traoré, cardiologue réputé, vous accorde 90 secondes entre deux patients. Il utilise un antihypertenseur historique à prendre 2 fois par jour.","caseProblem":"Comment lui démontrer le gain clinique de votre molécule à demi-vie de 32 heures ?","expertAnswer":"Docteur, grâce à sa demi-vie de 32 heures et sa haute affinité pour les récepteurs AT1, une seule prise matinale assure une couverture constante sur 24 heures et pardonne même un décalage ou un oubli de prise de quelques heures sans pic d'hypertension de rebond. Surtout, elle protège vos patients à 6h du matin lors du pic tensionnel matinal où surviennent 70% des accidents vasculaires cérébraux.","keyTakeaways":"La pharmacocinétique prend tout son sens quand on la traduit en bénéfice de survie et de protection pour le patient."},{"id":"m7-quiz","title":"7.6 Mini-Quiz d'évaluation : Module 7","isQuiz":true,"quizModuleId":7}]},{"id":8,"tier":"DEBUTANT","badge":"Module 8","title":"Module 8 : Pharmacologie II : Pharmacodynamie & Mécanismes d'action","objective":"Comprendre les récepteurs, agonistes, antagonistes, l'index thérapeutique, la tolérance et la relation dose-effet.","sections":[{"id":"m8-s1","title":"8.1 Récepteurs, Agonistes, Antagonistes et Index Thérapeutique","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 23 : Pharmacodynamie (Ce que le médicament fait au corps)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Étude des effets biochimiques, cellulaires et physiologiques des médicaments et de leurs mécanismes d'action moléculaires sur des cibles biologiques spécifiques.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Comment le médicament agit concrètement sur nos cellules pour faire baisser la fièvre, calmer la douleur ou détruire un parasite.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'ibuprofène qui bloque les enzymes COX pour arrêter la fabrication des prostaglandines responsables de l'inflammation.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 24 : Agoniste vs Antagoniste</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Un agoniste est une molécule qui se lie à un récepteur membranaire ou intracellulaire et déclenche une réponse biologique active (clé qui tourne et ouvre la porte). Un antagoniste se fixe sur le récepteur sans l'activer, empêchant physiquement la liaison du médiateur endogène (clé engagée qui bloque la serrure).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> L'agoniste appuie sur l'interrupteur pour allumer la lumière ; l'antagoniste colle un morceau d'adhésif sur l'interrupteur pour empêcher qu'on l'allume.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Le salbutamol est un agoniste bêta-2 qui dilate les bronches ; l'aténolol est un antagoniste bêta-1 qui freine le cœur.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 25 : Index Thérapeutique Étroit (Marge de Sécurité)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Rapport entre la dose toxique médiane (DT50) et la dose efficace médiane (DE50). Lorsque ce rapport est faible (< 2), de faibles variations de concentration plasmatique peuvent conduire à un échec thérapeutique ou à une toxicité grave.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Un médicament sur le fil du rasoir : un comprimé guérit, mais deux comprimés peuvent empoisonner gravement le malade.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> La digoxine, la théophylline, la warfarine (AVK) et le lithium qui nécessitent des prises de sang régulières pour surveiller leur taux sanguin.</div>\n          </div>\n        "},{"id":"m8-case","title":"8.7 Cas pratique : Expliquer la sélectivité bêta-1 d'un bêtabloquant","isCase":true,"caseId":"c8","caseContext":"Un médecin de famille traite un patient hypertendu qui a également des antécédents d'asthme léger d'effort.","caseProblem":"Pourquoi le délégué doit-il souligner la cardiosélectivité bêta-1 de sa molécule ?","expertAnswer":"La cardiosélectivité bêta-1 signifie que la molécule se lie préférentiellement aux récepteurs bêta-1 du cœur pour diminuer le travail cardiaque, tout en épargnant les récepteurs bêta-2 situés dans le muscle lisse bronchique. Les vieux bêtabloquants non sélectifs bloquaient aussi les bêta-2, provoquant des bronchospasmes étouffants parfois mortels chez les personnes prédisposées. La sélectivité est la garantie de la sécurité pulmonaire du patient.","keyTakeaways":"La sélectivité pharmacodynamique est l'argument reine de la sécurité d'emploi."},{"id":"m8-quiz","title":"8.8 Mini-Quiz d'évaluation : Module 8","isQuiz":true,"quizModuleId":8}]},{"id":9,"tier":"INTERMEDIAIRE","badge":"Module 9","title":"Module 9 : La classification ATC et les 14 groupes anatomiques de l'OMS","objective":"Maîtriser la codification universelle ATC à 5 niveaux et parcourir les 14 grands groupes de A à V.","sections":[{"id":"m9-s1","title":"9.1 Structure de la classification ATC et Panorama des 14 Groupes","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 26 : Système ATC (Anatomique, Thérapeutique et Chimique)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Système universel de codification des substances pharmaceutiques géré par le centre collaborateur de l'OMS à Oslo, subdivisant les médicaments en 5 niveaux selon l'organe cible, le groupe thérapeutique, le sous-groupe chimique et la substance individuelle.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le code-barres scientifique mondial qui classe chaque médicament dans le bon tiroir du corps humain.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> C09CA01 = Losartan (C pour Cardiovasculaire, 09 pour Rénine-Angiotensine, C pour Antagonistes Angiotensine II purs, A pour monothérapie, 01 pour losartan).</div>\n          </div>\n\n          <table class=\"table-science\">\n            <thead>\n              <tr><th>Code</th><th>Groupe Anatomique</th><th>Exemples majeurs de classes thérapeutiques</th></tr>\n            </thead>\n            <tbody>\n              <tr><td><strong>A</strong></td><td>Appareil digestif et métabolisme</td><td>IPP (Oméprazole), antidiabétiques oraux (Metformine), antispasmodiques.</td></tr>\n              <tr><td><strong>B</strong></td><td>Sang et organes hématopoïétiques</td><td>Anticoagulants (Héparine, AOD, AVK), antiagrégants plaquettaires, fer.</td></tr>\n              <tr><td><strong>C</strong></td><td>Système cardio-vasculaire</td><td>Antihypertenseurs (IEC, ARA2, diurétiques), statines hypolipémiantes.</td></tr>\n              <tr><td><strong>D</strong></td><td>Dermatologie</td><td>Antifongiques locaux, dermocorticoïdes, émollients, cicatrisants.</td></tr>\n              <tr><td><strong>G</strong></td><td>Système génito-urinaire et hormones sexuelles</td><td>Antiseptiques urinaires, contraceptifs oraux, traitements de la ménopause.</td></tr>\n              <tr><td><strong>H</strong></td><td>Hormones systémiques (hors sexuelles)</td><td>Corticoïdes par voie générale, hormones thyroïdiennes (Lévothyroxine).</td></tr>\n              <tr><td><strong>J</strong></td><td>Anti-infectieux à usage systémique</td><td>Antibiotiques (Pénicillines, Céphalosporines), antiviraux, vaccins.</td></tr>\n              <tr><td><strong>L</strong></td><td>Antinéoplasiques et immunomodulateurs</td><td>Chimiothérapies anticancéreuses, thérapies ciblées, immunothérapies anti-PD-1.</td></tr>\n              <tr><td><strong>M</strong></td><td>Système musculo-squelettique</td><td>AINS (Ibuprofène, Diclofénac), anti-goutteux, myorelaxants.</td></tr>\n              <tr><td><strong>N</strong></td><td>Système nerveux</td><td>Antalgiques (Paracétamol, Tramadol), antidépresseurs, anxiolytiques, antiépileptiques.</td></tr>\n              <tr><td><strong>P</strong></td><td>Produits antiparasitaires, insecticides</td><td>Antipaludiques (CTA : Artéméther-Luméfantrine), anthelminthiques.</td></tr>\n              <tr><td><strong>R</strong></td><td>Appareil respiratoire</td><td>Bronchodilatateurs (Salbutamol), corticoïdes inhalés, antihistaminiques.</td></tr>\n              <tr><td><strong>S</strong></td><td>Organes sensoriels</td><td>Collyres antibiotiques et anti-glaucomateux, gouttes auriculaires.</td></tr>\n              <tr><td><strong>V</strong></td><td>Divers (Varia)</td><td>Produits de contraste radiologiques, antidotes, solvants de perfusion.</td></tr>\n            </tbody>\n          </table>\n        "},{"id":"m9-case","title":"9.4 Cas pratique : Retrouver l'arborescence ATC d'une spécialité","isCase":true,"caseId":"c9","caseContext":"Le pharmacien chef d'une clinique privée vous demande d'intégrer dans son logiciel de gestion le code ATC exact de votre nouvel antidiabétique oral inhibiteur du SGLT2 (Dapagliflozine).","caseProblem":"Comment décomposer ce code avec rigueur scientifique ?","expertAnswer":"Code A10BK01 : A (Appareil digestif et métabolisme) -> A10 (Médicaments utilisés dans le diabète) -> A10B (Antidiabétiques oraux à l'exclusion des insulines) -> A10BK (Inhibiteurs du co-transporteur sodium-glucose de type 2 / SGLT2) -> A10BK01 (Dapagliflozine). Cette précision rassure le pharmacien sur la bonne imputation comptable et pharmacologique.","keyTakeaways":"La maîtrise du système ATC prouve votre niveau de culture pharmaceutique avancée."},{"id":"m9-quiz","title":"9.5 Mini-Quiz d'évaluation : Module 9","isQuiz":true,"quizModuleId":9}]},{"id":10,"tier":"INTERMEDIAIRE","badge":"Module 10","title":"Module 10 : Classes thérapeutiques I : Anti-infectieux & Antipaludéens","objective":"Maîtriser les grandes familles d'antibiotiques, la classification AWaRe de l'OMS, les CTA antipaludiques et la lutte contre l'antibiorésistance.","sections":[{"id":"m10-s1","title":"10.1 Familles d'Antibiotiques et Stratégie AWaRe de l'OMS","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 27 : Classification AWaRe de l'OMS</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Outil de politique sanitaire de l'OMS catégorisant les antibiotiques en 3 groupes : Access (première ligne à large disponibilité), Watch (deuxième ligne à surveiller avec risque de résistance élevé) et Reserve (dernier recours absolu à préserver pour les pathogènes multirésistants).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le feu tricolore des antibiotiques : Vert (Access) pour les infections courantes ; Orange (Watch) à surveiller de près ; Rouge (Reserve) gardé sous clé pour les urgences extrêmes.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'amoxicilline est dans le groupe Access ; la ceftriaxone et les fluoroquinolones sont dans Watch ; la colistine est dans Reserve.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 28 : CTA (Combinaison Thérapeutique à base d'Artémisinine)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Association fixe synergique d'un dérivé semi-synthétique d'artémisinine à élimination rapide mais puissante (Artéméther ou Artésunate) et d'une molécule partenaire à élimination plus lente (Luméfantrine ou Amodiaquine), standard universel de traitement du paludisme non compliqué.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> L'association coup de poing anti-palu : le premier médicament détruit 99% des parasites en 24h, et le second élimine les survivants sur plusieurs jours pour éviter toute rechute.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Coartem (Artéméther + Luméfantrine) administré en 6 prises réparties sur 3 jours avec un repas lipidique.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 29 : Antibiorésistance et BMR</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Capacité acquise par une souche bactérienne de survivre et proliférer en présence d'une concentration d'antibiotique habituellement inhibitrice, notamment par production de bêta-lactamases à spectre étendu (BLSE) ou mutation des cibles ribosomiques.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Les bactéries apprennent à résister aux antibiotiques si on les utilise pour des virus ou si le patient ne finit pas sa boîte.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Une infection urinaire nosocomiale à E. coli BLSE résistante à toutes les céphalosporines de 3e génération au CHU de Cocody.</div>\n          </div>\n        "},{"id":"m10-case","title":"10.7 Cas pratique : Sensibilisation d'un médecin au bon usage des fluoroquinolones","isCase":true,"caseId":"c10","caseContext":"Un médecin généraliste prescrit systématiquement de la ciprofloxacine pour de simples épisodes de toux fébrile ou de gastro-entérite bénigne.","caseProblem":"Comment le délégué médical engage-t-il un dialogue constructif sur l'antibiogouvernance ?","expertAnswer":"Le délégué rappelle avec tact les alertes récentes de l'OMS et des sociétés savantes : les fluoroquinolones appartiennent au groupe 'Watch' et sont associées à des risques d'effets indésirables durables (tendinopathies achilléennes, allongement de l'intervalle QT, sélection rapide de mutants résistants). Il valorise l'utilisation de tests de diagnostic rapide (TDR) et encourage la réservation des fluoroquinolones aux infections urinaires fébriles ou salmonelloses documentées.","keyTakeaways":"Le délégué médical responsable est un ambassadeur de la préservation du capital antibiotique mondial."},{"id":"m10-quiz","title":"10.8 Mini-Quiz d'évaluation : Module 10","isQuiz":true,"quizModuleId":10}]},{"id":11,"tier":"INTERMEDIAIRE","badge":"Module 11","title":"Module 11 : Classes thérapeutiques II : Cardio-vasculaires et Métaboliques","objective":"Maîtriser les spécificités de l'hypertension en Afrique subsaharienne, les IEC/ARA2, les anticalciques, les statines, les anticoagulants (AOD vs AVK) et les nouveaux antidiabétiques.","sections":[{"id":"m11-s1","title":"11.1 Hypertension chez le sujet d'Afrique subsaharienne & Bithérapies fixes","html":"\n          <div class=\"box-callout box-key\">\n            <div class=\"box-header\">Particularité hémodynamique et génétique</div>\n            <p>Chez les populations mélanodermes d'Afrique subsaharienne, l'hypertension artérielle se caractérise fréquemment par un profil à <strong>basse rénine</strong> avec <em>sensibilité sodée accrue</em>. Les monothérapi
