roduction officielle du vaccin antipaludique dans le programme national de vaccination de routine pour les enfants de moins de 2 ans en Côte d'Ivoire.</div>\n          </div>\n        "},{"id":"t1-case","title":"V.Cas. Cas pratique : Rétablir la confiance face aux rumeurs antivaccins","isCase":true,"caseId":"ct1","caseContext":"Dans un quartier populaire, une fausse information circule sur WhatsApp affirmant que le vaccin contre le papillomavirus humain (HPV) rend les jeunes filles stériles. Des mères de famille refusent massivement la campagne scolaire.","caseProblem":"Comment le délégué spécialisé en vaccins outille-t-il les sages-femmes et médecins scolaires pour répondre avec impact ?","expertAnswer":"1. Écoute empathique : Ne pas infantiliser ni mépriser la peur des mères de famille. 2. Preuve clinique irréfutable : Rappeler que le vaccin HPV protège contre le cancer du col de l'utérus, premier cancer féminin mortel en Côte d'Ivoire. 3. Démonstration de sécurité : Fournir les données de plus de 15 ans de recul mondial sur des centaines de millions de doses sans aucun impact sur la fertilité, qui au contraire protège l'appareil reproducteur des lésions précancéreuses destructrices. 4. Mobilisation communautaire : S'appuyer sur les femmes leaders d'associations de mères et les sages-femmes respectées du quartier pour porter le message en langues locales.","keyTakeaways":"La communication vaccinale repose sur la clarté scientifique, l'écoute sans jugement et le relais de leaders communautaires de confiance."},{"id":"t1-quiz","title":"V.Quiz. Mini-Quiz d'évaluation : Track Vaccins","isQuiz":true,"quizModuleId":101}]},{"id":102,"tier":"TRACKS","badge":"Track 2","title":"Track 2 : Dispositifs médicaux & Diagnostic rapide (D1 à D4)","objective":"Maîtriser la classification réglementaire des DM (Classes I à III), les Tests de Diagnostic Rapide (TDR), le matériel de perfusion sécurisé et la matériovigilance.","sections":[{"id":"t2-s1","title":"D1. Classification Réglementaire des Dispositifs Médicaux","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 70 : Dispositif Médical (DM)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Tout instrument, appareil, équipement, matière ou article utilisé seul ou en association chez l'être humain à des fins de diagnostic, prévention, contrôle ou traitement d'une pathologie, dont l'action principale voulue n'est pas obtenue par des moyens pharmacologiques, immunologiques ou métaboliques.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Tout objet technique de santé qui soigne ou diagnostique par son action physique ou mécanique (thermomètre, seringue, pansement, stent, scanner) et non par une molécule chimique.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Un cathéter intraveineux périphérique ou un lecteur glycémique avec ses bandelettes réactives.</div>\n          </div>\n\n          <table class=\"table-science\">\n            <thead>\n              <tr><th>Classe de DM</th><th>Niveau de risque</th><th>Exemples courants</th><th>Contrôle réglementaire</th></tr>\n            </thead>\n            <tbody>\n              <tr><td><strong>Classe I</strong></td><td>Risque faible</td><td>Compresses stériles, gants d'examen, lits d'hôpitaux, béquilles.</td><td>Auto-certification fabricant CE / Déclaration AIRP.</td></tr>\n              <tr><td><strong>Classe IIa</strong></td><td>Risque modéré</td><td>Aiguilles d'injection, tubulures de perfusion, TDR urinaires.</td><td>Organisme notifié / Dossier technique d'homologation.</td></tr>\n              <tr><td><strong>Classe IIb</strong></td><td>Risque élevé</td><td>Pousse-seringues électriques, préservatifs, machines de dialyse.</td><td>Examen CE de type et audit de production rigoureux.</td></tr>\n              <tr><td><strong>Classe III</strong></td><td>Risque très élevé / Vital</td><td>Stents coronariens, valves cardiaques, prothèses de hanche.</td><td>Évaluation clinique approfondie et autorisation préalable.</td></tr>\n            </tbody>\n          </table>\n        "},{"id":"t2-s2","title":"D2. Tests de Diagnostic Rapide (TDR) & Diagnostic Point-of-Care","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 71 : TDR Paludisme (Immunochromatographie Ag Pf/Pan)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Dispositif de diagnostic in vitro sur membrane de nitrocellulose détectant par migration capillaire les antigènes parasitaires spécifiques circulants dans une goutte de sang capillaire : la protéine HRP-2 spécifique de Plasmodium falciparum et la pLDH commune aux autres espèces (Pan), avec lecture visuelle colorimétrique en 15 minutes.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le test minute sur le doigt : une goutte de sang, 3 gouttes de liquide révélateur, et en 15 minutes on sait avec certitude si le patient a le paludisme sans avoir besoin de microscope électrique.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> La réalisation systématique d'un TDR devant toute fièvre en consultation de dispensaire avant de prescrire un antipaludique.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 72 : Sensibilité (Se) vs Spécificité (Sp) d'un Test</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> La sensibilité mesure la capacité du test à être positif chez les sujets réellement malades (minimise les faux négatifs). La spécificité mesure la capacité du test à être négatif chez les sujets sains indemnes de la maladie (minimise les faux positifs).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> La sensibilité ne rate aucun malade ; la spécificité n'accuse aucun innocent.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Un TDR du paludisme homologué par l'OMS doit avoir une sensibilité ≥ 95% pour des densités parasitaires ≥ 100 parasites/μL.</div>\n          </div>\n        "},{"id":"t2-case","title":"D.Cas. Cas pratique : Remplacement d'aiguilles simples par des dispositifs de sécurité","isCase":true,"caseId":"ct2","caseContext":"Dans une grande polyclinique, deux infirmières ont été victimes d'Accidents d'Exposition au Sang (AES) lors du recapuchonnage d'aiguilles après prélèvement sur des patients potentiellement séropositifs.","caseProblem":"Comment le délégué spécialisé en DM démontre-t-il la valeur vitale de ses cathéters sécurisés autobloquants auprès de la surveillante générale et du médecin du travail ?","expertAnswer":"1. Rappel épidémiologique : le recapuchonnage des aiguilles est la première cause d'AES en milieu hospitalier. 2. Démonstration technique : présenter le mécanisme de sécurité passif où l'aiguille se rétracte automatiquement et de façon irréversible dans le corps de la seringue dès l'injection terminée, avec un clic audible de verrouillage. 3. Argument pharmaco-économique : le surcoût de quelques centimes par seringue est dérisoire comparé aux coûts d'un protocole d'urgence prophylactique anti-VIH (trithérapie de 28 jours), des arrêts de travail et de l'angoisse du personnel soignant.","keyTakeaways":"La sécurité des soignants est un impératif éthique et financier majeur pour les établissements de santé."},{"id":"t2-quiz","title":"D.Quiz. Mini-Quiz d'évaluation : Track Dispositifs Médicaux","isQuiz":true,"quizModuleId":102}]},{"id":103,"tier":"TRACKS","badge":"Track 3","title":"Track 3 : OTC, Parapharmacie & Dermocosmétique tropicale (O1 à O4)","objective":"Maîtriser le conseil officinal, la dermocosmétique des peaux noires et métissées, la lutte contre la dépigmentation artificielle et la micronutrition.","sections":[{"id":"t3-s1","title":"O1. Médicaments OTC et Conseil au Comptoir Officinal","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 73 : Médicament OTC (Over-The-Counter / Automédication)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Spécialité pharmaceutique exonérée de la réglementation des substances vénéneuses pouvant être délivrée directement par le pharmacien d'officine sans ordonnance médicale obligatoire, pour le traitement de symptômes bénins et auto-limités d'évolution courte.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le médicament en vente libre au comptoir : pour soigner un petit mal de tête, une digestion difficile ou un rhume passager sans avoir besoin d'ordonnance.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Les antalgiques légers (paracétamol), pansements gastriques ou pastilles pour la gorge.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 74 : Drapeaux Rouges (Red Flags) en Officine</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Signes cliniques d'alerte ou symptômes de gravité identifiés lors de l'interrogatoire au comptoir qui excluent formellement l'automédication et imposent une réorientation médicale immédiate (ex. altération de l'état général, fièvre persistante > 48h, rectorragies, céphalée brutale 'en coup de tonnerre').</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Les signaux d'alarme : les indices qui disent au pharmacien 'stop à l'automédication, ce patient doit voir un médecin sans attendre'.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Un nourrisson fébrile avec refus de boire et léthargie qui doit être adressé d'urgence à la pédiatrie du CHU.</div>\n          </div>\n        "},{"id":"t3-s2","title":"O2. Dermocosmétique des Peaux Noires & Dangers de la Dépigmentation Artificielle","html":"\n          <div class=\"box-callout box-warning\">\n            <div class=\"box-header\">Fléau de santé publique : La dépigmentation artificielle volontaire</div>\n            <p>L'utilisation détournée de dermocorticoïdes très puissants (Clobétasol) et d'hydroquinone à fortes doses pour s'éclaircir la peau entraîne des ravages dermatologiques et systémiques majeurs : <strong>atrophie cutanée irréversible, vergetures géantes, ochronose, diabète cortico-induit et insuffisance surrénalienne aiguë</strong>.</p>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 75 : Phototype Cutané selon Fitzpatrick (Phototypes V & VI)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Classification dermatologique de la réponse de la peau au rayonnement ultraviolet : les phototypes V (peaux mates/métissées) et VI (peaux noires très pigmentées) possèdent une forte teneur en eumélanine photoprotectrice, mais sont hautement prédisposées aux dyschromies réactionnelles (hyperpigmentation post-inflammatoire) et aux chéloïdes.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> La peau noire est naturellement protégée contre les coups de soleil par sa mélanine, mais la moindre bouton ou blessure laisse une tache sombre tenace.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Proposer un écran solaire invisible spécifique sans traces blanches et un soin anti-taches formulé pour peau mélanoderme.</div>\n          </div>\n        "},{"id":"t3-case","title":"O.Cas. Cas pratique : Prise en charge d'une demande de corticoïde dépigmentant en officine","isCase":true,"caseId":"ct3","caseContext":"Une jeune femme entre dans une pharmacie d'Abidjan et demande 3 tubes de crème de Clobétasol (dermocorticoïde d'activité très forte) sans ordonnance, en affirmant que c'est pour illuminer son teint avant son mariage.","caseProblem":"Que doit faire l'équipe officinale formée par le délégué médical spécialisé ?","expertAnswer":"1. Refus ferme et catégorique de délivrance : Le Clobétasol est une substance vénéneuse soumise à prescription stricte pour des dermatoses inflammatoires graves (psoriasis sévère). 2. Dialogue bienveillant d'éducation sanitaire : Expliquer avec des photos cliniques les dangers irréversibles de la cortisone sur la peau du visage (peau qui s'amincit comme du papier à cigarette, infections fongiques foudroyantes, pilosité anormale, acné cortisonique). 3. Conseil dermocosmétique d'alternative saine : Orienter la patiente vers une gamme dermocosmétique certifiée et sans danger pour peau noire (nettoyant doux, sérum à la vitamine C et niacinamide pour l'éclat du teint, émollient hydratant et protection solaire).","keyTakeaways":"Le conseil dermocosmétique en officine est une véritable mission de santé publique pour préserver la santé et la beauté naturelle de la peau."},{"id":"t3-quiz","title":"O.Quiz. Mini-Quiz d'évaluation : Track OTC & Dermocosmétique","isQuiz":true,"quizModuleId":103}]},{"id":104,"tier":"TRACKS","badge":"Track 4","title":"Track 4 : Affaires médicales, Recherche clinique & MSL (M1 à M5)","objective":"Comprendre le métier de Medical Science Liaison (MSL), la conformité non-promotionnelle, les Bonnes Pratiques Cliniques (BPC/GCP) et les études en vie réelle (RWE).","sections":[{"id":"t4-s1","title":"M1. Le Rôle du Medical Science Liaison (MSL) et Déontologie Non-Promotionnelle","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 76 : Échange Scientifique Non-Promotionnel (Scientific Exchange)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Dialogue médical bilatéral objectif et transparent mené par un scientifique (MSL) en réponse à une demande non sollicitée d'un professionnel de santé, pouvant porter sur des données scientifiques en amont de l'AMM ou des mécanismes hors promotion commerciale sans aucune incitation à la prescription.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> La discussion purement scientifique entre pairs : pas de plaquette de vente, pas de négociation commerciale, juste la science médicale et les publications de recherche.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Discuter avec un oncologue universitaire des résultats préliminaires d'un essai de phase II sur un nouvel anticorps conjugué.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 77 : Real-World Evidence (RWE / Données de Vie Réelle)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Preuves cliniques relatives à l'utilisation, aux bénéfices et aux risques d'une spécialité pharmaceutique dérivées de l'analyse de données de santé réelles (dossiers médicaux informatisés, registres hospitaliers de patients, bases de données d'assurance maladie), complétant les essais randomisés rigides.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Ce qui se passe quand le médicament est utilisé par des milliers de vrais malades dans la vraie vie, avec leurs autres maladies et leurs oublis quotidiens.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'analyse d'un registre de 5 000 patients hypertendus suivis dans les hôpitaux publics ivoiriens évaluant l'adhésion au traitement sur 2 ans.</div>\n          </div>\n        "}]},{"id":105,"tier":"TRACKS","badge":"Track 5","title":"Track 5 : Santé publique, Épidémies & Urgence humanitaire (S1 à S4)","objective":"Comprendre les dynamiques épidémiques (paludisme, tuberculose, choléra, fièvres hémorragiques), le rôle du Fonds Mondial et des ONG et la logistique d'urgence.","sections":[{"id":"t5-s1","title":"S1. Épidémiologie des Grandes Endémies et Bailleurs Internationaux","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 78 : Fonds Mondial (GFATM) & Programmes Nationaux de Santé</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Partenariat financier international mobilisant des milliards de dollars pour financer les programmes nationaux de lutte contre le Sida, la Tuberculose et le Paludisme, assurant la gratuité des traitements de première intention (ARV, antituberculeux, CTA et moustiquaires imprégnées) dans les pays éligibles.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le grand trésor financier mondial qui permet de soigner gratuitement les malades du sida, du palu et de la tuberculose dans nos dispensaires.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'approvisionnement gratuit en kits d'artésunate injectable pour les cas de neuropaludisme de l'enfant dans les hôpitaux publics de Côte d'Ivoire.</div>\n          </div>\n        "}]},{"id":106,"tier":"TRACKS","badge":"Track 6","title":"Track 6 : Populations spéciales & Situations à risque (P1 à P4)","objective":"Maîtriser les adaptations posologiques chez l'enfant, le sujet âgé polypathologique, la femme enceinte ou allaitante et les insuffisants rénaux et hépatiques.","sections":[{"id":"t6-s1","title":"P1. Pédiatrie, Gériatrie, Grossesse & Allaitement","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 79 : Médicaments Tératogènes & Référence CRAT</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Substances capables d'induire des malformations anatomiques ou des anomalies fonctionnelles majeures chez l'embryon ou le fœtus lors de l'exposition in utero, particulièrement au 1er trimestre de grossesse (période d'embryogenèse). Le Centre de Référence sur les Agents Tératogènes (CRAT) constitue la référence scientifique internationale en langue française.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Les médicaments dangereux qui peuvent déformer ou blesser le bébé dans le ventre de sa maman.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Les rétinoïdes oraux (isotrétinoïne contre l'acné) et le valproate de sodium formellement contre-indiqués chez la femme enceinte.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 80 : Clairance de la Créatinine (Formule de Cockcroft-Gault / CKD-EPI)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Estimation de la fonction rénale indispensable pour adapter la posologie des médicaments à élimination rénale prédominante afin d'éviter les surdosages toxiques chez les personnes âgées : Clairance = [(140 - âge) x Poids (kg) x k] / Créatininémie (μmol/L), avec k = 1.23 chez l'homme et 1.04 chez la femme.</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> La formule mathématique qui calcule l'état d'usure des reins pour ajuster les doses de médicaments sans intoxiquer le patient âgé.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Réduire de 50% la dose d'un antibiotique aminoside chez un patient de 78 ans dont la clairance est de 30 mL/min.</div>\n          </div>\n        "}]},{"id":107,"tier":"TRACKS","badge":"Track 7","title":"Track 7 : Compétences transversales & Outils avancés (T1 à T4)","objective":"Maîtriser l'anglais médical pour multinationales, la négociation raisonnée de Harvard, l'analyse des données de ventes (IQVIA) et l'intelligence émotionnelle.","sections":[{"id":"t7-s1","title":"T1. Anglais Médical & Négociation Raisonnée","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 81 : Medical Terminology & Clinical Trial Lexicon</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Lexique international standardisé en langue anglaise utilisé dans les abstracts des congrès biomédicaux (Primary Endpoint, Overall Survival, Progression-Free Survival, Hazard Ratio, Confidence Interval, Adverse Drug Reaction).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le vocabulaire anglais indispensable pour lire les découvertes médicales mondiales et dialoguer avec les directeurs internationaux des multinationales.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Présenter lors d'un kick-off régional un Hazard Ratio (HR = 0.75) montrant une baisse de 25% du risque de récidive.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 82 : Négociation Raisonnée (Méthode de Harvard / BATNA)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Stratégie de négociation collaborative développée par Fisher et Ury visant un accord 'gagnant-gagnant' durable, fondée sur la séparation des personnes et du problème, la focalisation sur les intérêts mutuels plutôt que sur les positions fermées, et la préparation d'une solution de rechange solide (BATNA / MESORE).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Négocier sans faire la guerre : trouver une solution où chacun gagne quelque chose sans que personne ne perde la face.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> Négocier avec une clinique un partenariat de formation soignante plutôt qu'une baisse de prix agressive.</div>\n          </div>\n        "}]},{"id":108,"tier":"TRACKS","badge":"Track 8","title":"Track 8 : Marchés publics, Appels d'offres & Accès au marché (A1 à A5)","objective":"Maîtriser les circuits de la NPSP-CI, la réponse aux appels d'offres hospitaliers, le dossier technique CTD de l'AIRP et le panier de remboursement CMU.","sections":[{"id":"t8-s1","title":"A1. Mécanismes des Marchés Publics Pharmaceutiques et NPSP-CI","html":"\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 83 : Appel d'Offres International (AOI) Pharmaceutique</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Procédure publique et concurrentielle lancée par l'État ou une centrale d'achats nationale (NPSP-CI) pour l'acquisition de médicaments essentiels par lots, soumise aux codes des marchés publics et examinée par une commission pluridisciplinaire (dossier administratif, conformité technique BPF/AMM, et offre financière compétitive).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le grand concours public officiel : les laboratoires déposent leurs dossiers sous pli fermé pour fournir les médicaments des hôpitaux publics au meilleur rapport qualité-prix.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> L'attribution du marché national de fourniture des perfusions de solutés glucosés et salés pour 2 ans en Côte d'Ivoire.</div>\n          </div>\n\n          <div class=\"def-card\">\n            <div class=\"def-card-title\">📌 Notion 84 : Dossier Technique d'Enregistrement au Format CTD (Common Technical Document)</div>\n            <div class=\"def-row\"><span class=\"def-label expert\">🔬 Définition experte :</span> Structure internationale harmonisée en 5 modules imposée par l'ICH et l'AIRP pour le dépôt des demandes d'AMM : Module 1 (Renseignements administratifs et légaux), Module 2 (Résumés et synthèses d'experts), Module 3 (Qualité physico-chimique et pharmaceutique / CMC), Module 4 (Rapports d'études non cliniques/toxicologiques), Module 5 (Rapports d'études cliniques d'efficacité et de sécurité).</div>\n            <div class=\"def-row\"><span class=\"def-label simple\">💡 En langage simple :</span> Le classeur officiel universel en 5 parties qui prouve scientifiquement la qualité, la pureté, la sécurité et l'efficacité d'un médicament avant qu'il ne soit autorisé.</div>\n            <div class=\"def-row\"><span class=\"def-label example\">🎯 Exemple concret :</span> La fourniture des données de stabilité en zone climatique IVb (30°C et 75% d'humidité relative) exigée par l'AIRP pour valider une durée de conservation de 3 ans en Afrique.</div>\n          </div>\n        "},{"id":"t8-case","title":"A.Cas. Cas pratique : Montage d'un dossier d'appel d'offres hospitalier","isCase":true,"caseId":"ct8","caseContext":"Le CHU de Cocody publie un appel d'offres restreint pour l'approvisionnement en anesthésiques locaux et solutés de réanimation pour un montant de 150 millions de FCFA.","caseProblem":"Quels sont les points de contrôle critiques à vérifier avant le dépôt sous scellé pour éviter l'élimination d'office ?","expertAnswer":"1. Conformité administrative éliminatoire : Vérifier la validité des attestations fiscales et sociales à jour, ainsi que la caution bancaire de soumission établie par une banque agréée. 2. Conformité technique : Joindre les copies certifiées des AMM délivrées par l'AIRP, les certificats BPF récents de l'usine de fabrication, les fiches techniques avec engagement sur une date de péremption restante ≥ 80% à la livraison. 3. Offre financière : Chiffrage rigoureux hors taxes et toutes taxes comprises en FCFA, avec engagement ferme de maintien des prix pendant 12 mois et planning de livraisons échelonnées sécurisées.","keyTakeaways":"Dans les marchés publics, la moindre omission de formalité administrative élimine le meilleur dossier technique. La rigueur documentaire est absolue."},{"id":"t8-quiz","title":"A.Quiz. Mini-Quiz d'évaluation : Track Marchés Publics","isQuiz":true,"quizModuleId":108}]}];
    const EXAM_QUESTION_BANK = [{"id":1,"q":"Que décrit la pharmacocinétique par rapport à la pharmacodynamie ?","opts":["Ce que le médicament fait au corps","Ce que le corps fait au médicament (ADME)","Le coût de production","La couleur du comprimé"],"c":1,"exp":"La pharmacocinétique étudie Absorption, Distribution, Métabolisme et Excrétion."},{"id":2,"q":"Dans l'acronyme ADME, que représente la lettre M ?","opts":["Mélange","Métabolisme (transformation hépatique par les cytochromes P450)","Multiplication","Mise en réserve"],"c":1,"exp":"Le métabolisme transforme la molécule pour faciliter son élimination."},{"id":3,"q":"Combien de demi-vies (T1/2) sont nécessaires pour éliminer plus de 99% d'un médicament ?","opts":["1 demi-vie","3 demi-vies","7 demi-vies","20 demi-vies"],"c":2,"exp":"À 7 demi-vies, il ne reste que 0.78% de la concentration initiale."},{"id":4,"q":"Combien de demi-vies faut-il en moyenne pour atteindre l'état d'équilibre (Steady-State) ?","opts":["2 demi-vies","5 demi-vies","10 demi-vies","25 demi-vies"],"c":1,"exp":"L'état d'équilibre plasmatique est atteint en environ 5 demi-vies."},{"id":5,"q":"Quelle est la définition d'un antagoniste en pharmacodynamie ?","opts":["Une molécule qui active le récepteur","Une molécule qui se lie au récepteur sans l'activer et bloque l'agoniste","Un antibiotique","Un excipient"],"c":1,"exp":"L'antagoniste bloque la liaison du médiateur sans déclencher d'effet propre."},{"id":6,"q":"Quel groupe de la classification ATC correspond au système cardio-vasculaire ?","opts":["Groupe A","Groupe B","Groupe C","Groupe N"],"c":2,"exp":"La lettre C désigne le système cardio-vasculaire."},{"id":7,"q":"À quel groupe ATC appartiennent les anti-infectieux à usage systémique ?","opts":["Groupe J","Groupe D","Groupe M","Groupe V"],"c":0,"exp":"J = Anti-infectieux à usage systémique."},{"id":8,"q":"Quelle classe thérapeutique trouve-t-on dans le groupe ATC N ?","opts":["Les diurétiques","Les psychotropes et antalgiques du système n     class YonahTrainingEngine {
      constructor() {
        this.currentSectionId = "home";
        this.activeTierFilter = "ALL";
        this.userName = "";
        this.readSections = [];
        this.bookmarks = [];
        this.moduleQuizScores = {};
        this.userCaseAnswers = {};
        this.violations = [];
        this.isDarkMode = false;
        this.examInProgress = false;
        this.examTimerSec = 3600; // 60 minutes
        this.examInterval = null;
        this.examQuestionsActive = [];
        this.examUserAnswers = {};
        this.examResult = null;
        this.flatSections = [];
        this.blurTimeout = null;

        this.initFlatList();
        this.loadStorage();
        this.applyTheme();
        this.renderSidebar();
        this.renderCurrentView();
        this.bindEvents();
      }

      initFlatList() {
        this.flatSections = [];
        YONAH_COURSE_DATA.forEach((mod) => {
          mod.sections.forEach((sec) => {
            this.flatSections.push({
              ...sec,
              moduleId: mod.id,
              moduleTier: mod.tier,
              moduleBadge: mod.badge,
              moduleTitle: mod.title
            });
          });
        });
      }

      loadStorage() {
        try {
          const raw = localStorage.getItem("yonah_dm_v4_store") || localStorage.getItem("yonah_dm_v3_store");
          if (raw) {
            const data = JSON.parse(raw);
            this.userName = data.userName || "";
            this.readSections = Array.isArray(data.readSections) ? data.readSections : [];
            this.bookmarks = Array.isArray(data.bookmarks) ? data.bookmarks : [];
            this.moduleQuizScores = data.moduleQuizScores || {};
            this.userCaseAnswers = data.userCaseAnswers || {};
            this.isDarkMode = Boolean(data.isDarkMode);
            this.examResult = data.examResult || null;
            this.currentSectionId = data.lastSec || "home";
          }
        } catch (e) {
          console.warn("Storage load error", e);
        }
      }

      saveStorage() {
        try {
          const payload = {
            userName: this.userName,
            readSections: this.readSections,
            bookmarks: this.bookmarks,
            moduleQuizScores: this.moduleQuizScores,
            userCaseAnswers: this.userCaseAnswers,
            isDarkMode: this.isDarkMode,
            examResult: this.examResult,
            lastSec: this.currentSectionId
          };
          localStorage.setItem("yonah_dm_v4_store", JSON.stringify(payload));
        } catch (e) {
          console.warn("Storage save error", e);
        }
      }

      applyTheme() {
        if (this.isDarkMode) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
      }

      toggleTheme() {
        this.isDarkMode = !this.isDarkMode;
        this.applyTheme();
        this.saveStorage();
        this.showToast(this.isDarkMode ? "Mode sombre activé" : "Mode clair activé");
      }

      showToast(text) {
        const el = document.getElementById("toastMessage");
        if (!el) return;
        el.textContent = text;
        el.style.opacity = "1";
        el.style.transform = "translateX(-50%) translateY(0)";
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transform = "translateX(-50%) translateY(20px)";
        }, 2200);
      }

      toggleSidebar() {
        const sb = document.getElementById("sidebar");
        const bd = document.getElementById("sideBackdrop");
        sb?.classList.toggle("open");
        bd?.classList.toggle("active");
      }

      closeSidebar() {
        const sb = document.getElementById("sidebar");
        const bd = document.getElementById("sideBackdrop");
        sb?.classList.remove("open");
        bd?.classList.remove("active");
      }

      promptUserName() {
        const cur = this.userName || "Apprenant";
        const val = prompt("Entrez votre Nom et Prénom pour la certification Yonah :", cur);
        if (val && val.trim()) {
          this.userName = val.trim();
          this.saveStorage();
          this.updateUserBadge();
          this.showToast("Profil apprenant mis à jour");
        }
      }

      updateUserBadge() {
        const elName = document.getElementById("userNameDisplay");
        const elAvatar = document.getElementById("userAvatar");
        const elLvl = document.getElementById("userLevelDisplay");
        const dispName = this.userName || "Apprenant Yonah";
        if (elName) elName.textContent = dispName;
        if (elAvatar) elAvatar.textContent = dispName.charAt(0).toUpperCase();

        const xp = this.readSections.length * 40 + Object.keys(this.moduleQuizScores).length * 120 + (this.examResult?.passed ? 1500 : 0);
        let lvl = "🟢 Niveau 1 : Débutant";
        if (xp >= 3500 || this.examResult?.passed) lvl = "🔴 Niveau 4 : Expert Certifié";
        else if (xp >= 2200) lvl = "🟠 Niveau 3 : Avancé";
        else if (xp >= 900) lvl = "🟡 Niveau 2 : Intermédiaire";

        if (elLvl) elLvl.textContent = `${lvl} (${xp} XP)`;
      }

      calculateProgress() {
        const total = this.flatSections.length;
        if (total === 0) return 0;
        const read = new Set(this.readSections).size;
        return Math.min(100, Math.round((read / total) * 100));
      }

      filterByTier(tierKey) {
        this.activeTierFilter = tierKey;
        document.querySelectorAll(".tier-tab-btn").forEach((b) => b.classList.remove("active"));
        document.getElementById(`tabTier-${tierKey}`)?.classList.add("active");
        this.renderSidebar();
      }

      showHome() {
        if (this.examInProgress) return;
        this.currentSectionId = "home";
        this.saveStorage();
        this.closeSidebar();
        this.renderCurrentView();
        this.renderSidebar();
      }

      goToSection(id) {
        if (this.examInProgress && id !== "m30-exam") {
          alert("Examen en cours ! Terminez ou soumettez l'épreuve avant de naviguer.");
          return;
        }
        this.currentSectionId = id;
        this.saveStorage();
        this.closeSidebar();
        this.renderCurrentView();
        this.renderSidebar();
        document.getElementById("mainContentScroll")?.scrollTo({ top: 0, behavior: "smooth" });
      }

      navigateOffset(offset) {
        if (this.examInProgress) return;
        if (this.currentSectionId === "home") {
          if (offset > 0 && this.flatSections.length > 0) {
            this.goToSection(this.flatSections[0].id);
          }
          return;
        }
        const idx = this.flatSections.findIndex((s) => s.id === this.currentSectionId);
        if (idx === -1) return;
        const target = idx + offset;
        if (target < 0) {
          this.showHome();
        } else if (target < this.flatSections.length) {
          this.goToSection(this.flatSections[target].id);
        }
      }

      toggleSectionRead(id) {
        if (this.readSections.includes(id)) {
          this.readSections = this.readSections.filter((x) => x !== id);
          this.showToast("Section marquée comme non lue");
        } else {
          this.readSections.push(id);
          this.showToast("Section validée ! +40 XP");
        }
        this.saveStorage();
        this.updateUserBadge();
        this.renderSidebar();
        this.renderCurrentView();
      }

      renderSidebar() {
        const nav = document.getElementById("sidebarModuleList");
        if (!nav) return;
        this.updateUserBadge();

        let html = `
          <div class="mod-group">
            <button class="sec-link-btn ${this.currentSectionId === "home" ? "active" : ""}" onclick="app.showHome()">
              <span>🏠 Tableau de bord global</span>
            </button>
          </div>
        `;

        const tiers = ["DEBUTANT", "INTERMEDIAIRE", "AVANCE", "EXPERT", "TRACKS"];

        tiers.forEach((tKey) => {
          if (this.activeTierFilter !== "ALL" && this.activeTierFilter !== tKey) return;
          const tMeta = TIERS_META[tKey];
          const modsInTier = YONAH_COURSE_DATA.filter((m) => m.tier === tKey);

          html += `
            <div class="tier-group-header">
              <span>${tMeta.name}</span>
            </div>
          `;

          modsInTier.forEach((mod) => {
            html += `
              <div class="mod-group" id="modBox-${mod.id}">
                <button class="mod-header-btn" onclick="app.toggleModCollapse(${mod.id})">
                  <div class="mod-header-title">
                    <span class="badge-number">${mod.id > 100 ? 'T' + (mod.id - 100) : mod.id}</span>
                    <span style="line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px;">${mod.title.replace(/^Module \d+ : |^Track \d+ : /, '')}</span>
                  </div>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <ul class="sec-list">
            `;

            mod.sections.forEach((sec) => {
              const isActive = sec.id === this.currentSectionId;
              const isRead = this.readSections.includes(sec.id);
              html += `
                <li>
                  <button class="sec-link-btn ${isActive ? "active" : ""}" onclick="app.goToSection('${sec.id}')">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px;">${sec.title}</span>
                    ${isRead ? '<span style="color:var(--yonah-emerald); font-weight:800;">✓</span>' : ''}
                  </button>
                </li>
              `;
            });

            html += `</ul></div>`;
          });
        });

        nav.innerHTML = html;
      }

      toggleModCollapse(modId) {
        const el = document.getElementById(`modBox-${modId}`);
        el?.classList.toggle("collapsed");
      }

      renderCurrentView() {
        const mount = document.getElementById("readingContainer");
        const posText = document.getElementById("navPosText");
        const btnPrev = document.getElementById("btnNavPrev");
        const btnNext = document.getElementById("btnNavNext");
        if (!mount) return;

        if (this.currentSectionId === "home") {

        const idx = this.flatSections.findIndex((s) => s.id === sec.id);
        const total = this.flatSections.length;
        if (posText) posText.textContent = `Section ${idx + 1} / ${total}`;
        if (btnPrev) btnPrev.disabled = false;
        if (btnNext) {
          btnNext.disabled = idx === total - 1;
          btnNext.querySelector("span").textContent = idx === total - 1 ? "Fin" : "Suivant";
        }

        const isRead = this.readSections.includes(sec.id);
        const tMeta = TIERS_META[sec.moduleTier] || TIERS_META.DEBUTANT;

        let html = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:0.75rem;">
            <div>
              <span style="font-size:0.75rem; font-weight:800; color:var(--yonah-gold-dark); text-transform:uppercase; margin-right:0.6rem;">${tMeta.name}</span>
              <span style="font-size:0.85rem; font-weight:700; color:var(--yonah-navy);">${sec.moduleBadge}</span>
            </div>
            <button class="btn-nav-touch" onclick="app.toggleSectionRead('${sec.id}')" style="min-width:auto; height:34px; padding:0 0.75rem; font-size:0.8rem; ${isRead ? 'background:var(--yonah-emerald-light); color:var(--yonah-emerald); border-color:var(--yonah-emerald);' : ''}">
              ${isRead ? '✓ Validé (+40 XP)' : 'Marquer comme lu'}
            </button>
          </div>
          <h1 style="font-size:1.6rem; font-weight:900; color:var(--text-main); margin-bottom:1.25rem; line-height:1.25;">${sec.title}</h1>
          <div style="font-size:1.02rem; line-height:1.75; color:var(--text-main);">
            ${sec.html || ''}
          </div>
        `;

        mount.innerHTML = html;

        if (sec.isCase) {
          this.mountCaseStudy(sec);

          this.mountExamContract();

          this.mountExamSession();

          this.mountCertificateView();
        }

        mount.innerHTML = `

      saveHomeName(val) {
        this.userName = val.trim();
        this.saveStorage();
        this.updateUserBadge();
        this.showToast("Nom enregistré pour la certification");
      }

      runAdmeCalc() {
        const inp = document.getElementById("calcT12Input");
        const resEl = document.getElementById("admeCalcResult");
        if (!inp || !resEl) return;
        const t12 = parseFloat(inp.value) || 12;
        const ss = (t12 * 5).toFixed(1);
        const el = (t12 * 7).toFixed(1);
        resEl.innerHTML = `<strong>Résultats cinétiques pour T1/2 = ${t12}h :</strong><br>• État d'équilibre (Steady-State 97%) : <strong>${ss}h</strong> (5 demi-vies)<br>• Élimination complète (>99%) : <strong>${el}h</strong> (7 demi-vies).<br><em>Règle Yonah : Pour une T1/2 > 20h, une seule prise matinale assure une couverture constante sur 24h.</em>`;
      }

      mountCaseStudy(sec) {
        const box = document.createElement("div");
        box.className = "case-card";
        const savedAns = this.userCaseAnswers[sec.caseId] || "";

        box.innerHTML = `
          <div class="case-badge-banner">CAS PRATIQUE DE TERRAIN</div>
          <div class="case-title">${sec.title}</div>

          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">

      mountModuleQuiz(modId) {

            <div style="background:var(--surface-subtle); border-radius:var(--radius-md); padding:1rem; margin-bottom:1rem;">

                  <button class="btn-nav-touch" style="text-align:left; justify-content:flex-start; height:auto; padding:0.5rem 0.8rem;" onclick="app.checkModuleQuizAnswer(this, ${oIdx === q.c}, '${q.exp.replace(/'/g, "\\'")}')">

        if (isCorrect) {
          btn.style.background = "var(--yonah-emerald)";

      mountExamContract() {
        const box = document.getElementById("contractActionBox");
        if (!box) return;

        box.innerHTML = `
          <div style="background:var(--surface); border:2px solid var(--yonah-navy); border-radius:var(--radius-lg); padding:1.5rem; text-align:center;">
            <h3 style="font-size:1.25rem; font-weight:800; color:var(--yonah-navy); margin-bottom:0.75rem;">
              Prêt pour l'Examen Certifiant National ?

            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.25rem; line-height:1.5;">
              Candidat déclaré : <strong>${this.userName || "Apprenant non renseigné"}</strong><br>
              En cliquant sur "Démarrer l'Examen", vous acceptez le basculement en plein écran et le protocole anti-triche sous peine d'invalidation automatique après 3 violations.
            </p>
            <button class="btn-nav-touch primary" onclick="app.launchExam()" style="height:50px; font-size:1rem; padding:0 2rem;">
              Démarrer l'Examen (40 Questions • 60 Min)
            </button>
          </div>
        `;
      }

      launchExam() {
        if (!this.userName || !this.userName.trim()) {
          const val = prompt("Veuillez saisir votre Nom et Prénom pour l'examen officiel :");
          if (!val || !val.trim()) return;
          this.userName = val.trim();
          this.saveStorage();
          this.updateUserBadge();
        }

        try {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } catch (e) {}

        this.examInProgress = true;
        this.violations = [];
        this.examTimerSec = 3600;
        this.examUserAnswers = {};

        // Tirage aléatoire de 40 questions avec Fisher-Yates
        const pool = [...EXAM_QUESTION_BANK];
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        this.examQuestionsActive = pool.slice(0, 40);

        this.startExamTimer();
        this.goToSection("m30-exam");
        this.showToast("Session d'examen sécurisée active");
      }

      startExamTimer() {
        if (this.examInterval) clearInterval(this.examInterval);
        this.examInterval = setInterval(() => {
          this.examTimerSec--;
          const el = document.getElementById("examLiveTimer");
          if (el) {
            const m = Math.floor(this.examTimerSec / 60);
            const s = this.examTimerSec % 60;
            el.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          }
          if (this.examTimerSec <= 0) {
            clearInterval(this.examInterval);
            this.finishExam(true);
          }
        }, 1000);
      }

      recordViolation(type, msg) {
        if (!this.examInProgress) return;
        this.violations.push({ type, msg, time: new Date().toLocaleTimeString() });
        const count = this.violations.length;

        if (count >= 3) {
          this.examInProgress = false;
          clearInterval(this.examInterval);
          this.examResult = {
            invalidated: true,
            reason: "Session invalidée : 3 violations du protocole anti-triche détectées.",
            violationsCount: count,
            date: new Date().toLocaleDateString()
          };
          this.saveStorage();
          alert("ALERTE INTÉGRITÉ YONAH : 3 violations détectées. Votre session d'examen est immédiatement invalidée.");
          this.goToSection("m30-cert");
          return;
        }

        alert(`AVERTISSEMENT D'INTÉGRITÉ (${count}/3) : ${msg}. Restez concentré sur l'écran d'examen.`);
      }

        if (!mount) return;

        if (!this.examInProgress) {

            </div>
            <div style="display:flex; align-items:center; gap:1.5rem;">
              <div style="text-align:right;">
                <span style="font-size:0.75rem; opacity:0.8;">TEMPS RESTANT</span><br>

                Terminer & Valider
              </button>
            </div>
          </div>

          <div id="examQuestionsContainer">
            ${this.examQuestionsActive.map((q, idx) => `
              <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:1.25rem; margin-bottom:1.25rem;">
                <p style="font-weight:800; font-size:1.02rem; margin-bottom:0.75rem; color:var(--text-main);">
                  Question ${idx + 1} / ${this.examQuestionsActive.length} : ${q.q}
                </p>
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                  ${q.opts.map((opt, oIdx) => `
                    <label style="display:flex; align-items:center; gap:0.75rem; padding:0.6rem 0.8rem; border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer;" class="exam-opt-label">
                      <input type="radio" name="examQ_${q.id}" value="${oIdx}" onchange="app.recordExamChoice(${q.id}, ${oIdx})">
                      <span style="font-size:0.95rem;">${opt}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div style="text-align:center; margin:2rem 0;">
            <button class="btn-nav-touch primary" onclick="app.finishExam(false)" style="height:50px; font-size:1.05rem; padding:0 2.5rem;">
              Soumettre définitivement mon Examen
            </button>
          </div>
        `;
      }

      recordExamChoice(qId, optIdx) {
        this.examUserAnswers[qId] = optIdx;
      }

      async finishExam(autoSubmit) {
        if (!this.examInProgress) return;
        this.examInProgress = false;
        clearInterval(this.examInterval);

        let score = 0;
        this.examQuestionsActive.forEach((q) => {
          if (this.examUserAnswers[q.id] === q.c) {
            score++;
          }
        });

        const total = this.examQuestionsActive.length;
        const pct = Math.round((score / total) * 100);
        const passed = pct >= 80;

        // Génération de l'identifiant cryptographique SHA-256
        const seed = `${this.userName}_${score}_${Date.now()}__YONAH_CERT_SALT_2025`;
        let certHex = "";
        try {
          const enc = new TextEncoder().encode(seed);
          const buf = await crypto.subtle.digest("SHA-256", enc);
          const arr = Array.from(new Uint8Array(buf));
          certHex = arr.slice(0, 3).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        } catch (e) {
          certHex = Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        const certId = `YONAH-DM-2025-${certHex}`;

        this.examResult = {
          passed,
          score,
          total,
          pct,
          certId,
          date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }),
          violationsCount: this.violations.length,
          autoSubmitted: autoSubmit
        };

        this.saveStorage();
        this.updateUserBadge();
        this.goToSection("m30-cert");
      }

      mountCertificateView() {
        const mount = document.getElementById("certificateViewMount");
        if (!mount) return;

        if (!this.examResult) {
          mount.innerHTML = `
            <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:2rem; text-align:center;">
              <p>Vous n'avez pas encore passé l'examen final de certification.</p>
              <button class="btn-nav-touch primary" onclick="app.goToSection('m30-integrity')" style="margin-top:1rem;">Accéder au protocole d'examen</button>
            </div>
          `;
          return;
        }

        const res = this.examResult;

        if (res.invalidated) {
          mount.innerHTML = `
            <div style="background:var(--yonah-danger-light); border:3px solid var(--yonah-danger); border-radius:var(--radius-lg); padding:2.5rem 1.5rem; text-align:center;">
              <h2 style="color:var(--yonah-danger); font-size:1.6rem; font-weight:900; margin-bottom:0.75rem;">SESSION INVALIDÉE POUR VIOLATION D'INTÉGRITÉ</h2>
              <p style="font-size:1rem; line-height:1.6; max-width:550px; margin:0 auto 1.5rem;">
                Le protocole de surveillance a relevé 3 violations (sorties d'onglet ou fenêtre non active). L'examen doit être repassé dans le respect du protocole.
              </p>
              <button class="btn-nav-touch" onclick="app.goToSection('m30-integrity')">Repasser l'examen</button>
            </div>
          `;
          return;
        }

        if (!res.passed) {
          mount.innerHTML = `
            <div style="background:var(--surface); border:2px solid var(--border); border-radius:var(--radius-lg); padding:2.5rem 1.5rem; text-align:center;">
              <h2 style="font-size:1.5rem; font-weight:800; margin-bottom:0.5rem;">Score obtenu : ${res.score} / ${res.total} (${res.pct}%)</h2>
              <p style="color:var(--text-muted); margin-bottom:1.5rem;">Le seuil d'excellence Yonah est de 80% (32/40). Révisez les modules et retentez l'épreuve !</p>
              <button class="btn-nav-touch primary" onclick="app.goToSection('m30-integrity')">Recommencer l'examen</button>
            </div>
          `;
          return;
        }

        // CERTIFICAT VALIDE
        mount.innerHTML = `
          <div class="cert-wrap">
            <svg class="cert-seal-box" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="48" fill="#062335" stroke="#D4A24C" stroke-width="4"/>
              <path d="M50 15 L55 26 L66 26 L57 33 L61 44 L50 37 L39 44 L43 33 L34 26 L45 26 Z" fill="#D4A24C"/>
              <path d="M50 38 L50 78" stroke="#D4A24C" stroke-width="4" stroke-linecap="round"/>
              <path d="M50 48 C62 44, 62 58, 50 60 C38 62, 38 72, 50 74" stroke="#0E7C66" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </svg>
            <div class="cert-title-huge">CERTIFICAT D'EXCELLENCE PROFESSIONNELLE</div>
            <div class="cert-sub-text">INSTITUT D'EXCELLENCE YONAH • PARCOURS CERTIFIANT D'ÉLITE</div>
            <p style="font-size:0.95rem; text-transform:uppercase; letter-spacing:1px; color:#4A5568;">Il est officiellement certifié que</p>
            <div class="cert-recipient">${this.userName || "Apprenant Certifié"}</div>
            <p class="cert-statement">
              a satisfait avec distinction aux exigences théoriques, scientifiques et pratiques de l'ensemble des <strong>30 modules</strong> et des <strong>tracks de spécialisation</strong> du programme officiel <strong>« Délégué Médical : Du Débutant à l'Expert »</strong>, sous protocole de surveillance anti-triche renforcé, attestant de ses compétences de haut niveau pour exercer, conseiller et diriger auprès des professionnels de santé et des institutions sanitaires.
            </p>
            <div class="cert-meta-grid">
              <div>
                <strong>Identifiant unique :</strong><br>
                <span style="font-family:monospace; color:#0B3D5C; font-weight:800;">${res.certId}</span>
              </div>
              <div>
                <strong>Date de délivrance :</strong><br>
                ${res.date}
              </div>
              <div>
                <strong>Score & Intégrité :</strong><br>
                ${res.score} / ${res.total} (${res.pct}%) • ${res.violationsCount === 0 ? '✓ SANS VIOLATION' : 'VIOLATION MINEURE'}
              </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2rem; padding-top:1.5rem; border-top:1px dashed #CBD5E0;">
              <div style="text-align:left;">
                <svg width="68" height="68" viewBox="0 0 25 25" style="border:1px solid #D4A24C; padding:2px; background:white;">
                  <rect width="25" height="25" fill="white"/>
                  <path d="M1 1h7v7H1zM3 3h3v3H3zM17 1h7v7h-7zM19 3h3v3h-3zM1 17h7v7H1zM3 19h3v3H3zM10 2h2v2h-2zM14 2h2v2h-2zM10 6h4v2h-4zM2 10h3v2H2zM6 10h4v2H6zM11 11h3v3h-3zM17 10h2v2h-2zM21 11h3v2h-3zM10 17h2v2h-2zM14 17h4v2h-4zM10 21h2v3h-2zM14 21h3v3h-3zM19 17h4v2h-4zM20 21h3v3h-3z" fill="#0B3D5C"/>
                </svg>
                <div style="font-size:0.65rem; color:#718096; margin-top:0.2rem;">QR Authentification</div>
              </div>
              <div class="cert-signature-area">
                <svg class="cert-sig-svg" viewBox="0 0 140 50">
                  <path d="M10 35 Q 40 5, 70 30 T 130 20" stroke="#0B3D5C" stroke-width="2.5" fill="none"/>
                  <path d="M30 40 Q 60 15, 90 35" stroke="#D4A24C" stroke-width="1.8" fill="none"/>
                </svg>
                <span style="font-size:0.75rem; font-weight:800; color:#062335;">Pr. A. Konan</span>
                <span style="font-size:0.68rem; color:#718096;">Président du Conseil Scientifique Yonah</span>
              </div>
            </div>
          </div>

          <div class="btn-print-hide" style="text-align:center; margin:1.5rem 0 3rem;">
            <button class="btn-nav-touch primary" onclick="window.print()" style="height:50px; font-size:1rem; padding:0 2rem;">
              Imprimer / Exporter mon Certificat (PDF)
            </button>
          </div>
        `;
      }

      showVerifyModal() {
        const slot = document.getElementById("modalSlot");
        if (!slot) return;

        slot.innerHTML = `
          <div class="cheat-alert-modal" onclick="app.closeModalSlot(event)">
            <div class="cheat-alert-card" style="border-color:var(--yonah-navy); text-align:left;" onclick="event.stopPropagation()">
              <h3 style="font-size:1.3rem; font-weight:900; color:var(--yonah-navy); margin-bottom:0.75rem;">Vérifier un Certificat Yonah</h3>
              <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:1rem;">
                Entrez l'identifiant officiel figurant sur le document (ex : YONAH-DM-2025-XXXXXX) :
              </p>
              <input type="text" id="verifyCertInput" class="search-input-field" placeholder="YONAH-DM-2025-..." style="margin-bottom:1rem; text-transform:uppercase;">
              <button class="btn-nav-touch primary" style="width:100%; margin-bottom:1rem;" onclick="app.verifyCertAction()">Vérifier l'authenticité</button>
              <div id="verifyResultSlot" style="font-size:0.9rem;"></div>
              <button class="btn-nav-touch" style="width:100%; margin-top:0.5rem;" onclick="app.closeModalSlot()">Fermer</button>
            </div>
          </div>
        `;
      }

      verifyCertAction() {
        const inEl = document.getElementById("verifyCertInput");
        const resSlot = document.getElementById("verifyResultSlot");
        if (!inEl || !resSlot) return;

        const val = inEl.value.trim().toUpperCase();
        if (this.examResult && this.examResult.certId === val && this.examResult.passed) {
          resSlot.innerHTML = `
            <div style="background:var(--yonah-emerald-light); border:1px solid var(--yonah-emerald); padding:0.85rem; border-radius:var(--radius-sm); color:#064e3b;">
              <strong>✓ CERTIFICAT OFFICIEL AUTHENTIQUE</strong><br>
              Titulaire : <strong>${this.userName}</strong><br>
              Date : ${this.examResult.date}<br>
              Parcours : 30 Modules & Spécialisations • Score : ${this.examResult.score}/${this.examResult.total} (${this.examResult.pct}%)
            </div>
          `;
        } else {
          resSlot.innerHTML = `
            <div style="background:var(--yonah-danger-light); border:1px solid var(--yonah-danger); padding:0.85rem; border-radius:var(--radius-sm); color:#7f1d1d;">
              <strong>✗ CERTIFICAT INTROUVABLE DANS LA BASE LOCALE</strong><br>
              Vérifiez la saisie exacte du code.
            </div>
          `;
        }
      }

      showInstitutionalModal() {
        const slot = document.getElementById("modalSlot");
        if (!slot) return;

        const info = INSTITUTIONAL_INFO;

        slot.innerHTML = `
          <div class="cheat-alert-modal" onclick="app.closeModalSlot(event)">
            <div class="cheat-alert-card" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:2px solid var(--yonah-gold); padding-bottom:0.5rem;">
                <h2 style="font-size:1.35rem; font-weight:900; color:var(--yonah-navy);">${info.about.title}</h2>
                <button class="icon-btn" onclick="app.closeModalSlot()" style="width:32px; height:32px;">✕</button>
              </div>

              <div style="font-size:0.92rem; line-height:1.6; color:var(--text-main); margin-bottom:1.5rem;">
                <p><strong>Siège académique :</strong> ${info.about.location}</p>
                <p style="margin-top:0.4rem;">${info.about.mission}</p>
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:1.5rem;">
                ${info.about.stats.map(s => `
                  <div style="background:var(--surface-subtle); border-radius:var(--radius-md); padding:0.75rem; border-left:3px solid var(--yonah-gold);">
                    <div style="font-size:1.3rem; font-weight:900; color:var(--yonah-navy);">${s.value}</div>
                    <div style="font-size:0.78rem; color:var(--text-muted); font-weight:600;">${s.label}</div>
                  </div>
                `).join('')}
              </div>

              <div class="box-callout box-key" style="margin:1rem 0;">
                <div class="box-header">Immersion Clinique Hospitalière de 4 Semaines</div>
                <p style="font-size:0.88rem;">${info.about.immersion}</p>
              </div>

              <h3 style="font-size:1.15rem; font-weight:800; color:var(--yonah-navy); margin:1.25rem 0 0.75rem;">Membres Éminents du Conseil Scientifique</h3>
              <div style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1.5rem;">
                ${info.committee.map(c => `
                  <div style="background:var(--surface-subtle); border-radius:var(--radius-md); padding:0.8rem;">
                    <div style="font-weight:800; font-size:0.95rem; color:var(--yonah-navy);">${c.name} — <span style="color:var(--yonah-gold-dark); font-weight:700;">${c.title}</span></div>
                    <div style="font-size:0.82rem; font-weight:600; color:var(--text-muted);">${c.role}</div>
                    <div style="font-size:0.8rem; margin-top:0.25rem; font-style:italic;">${c.bio}</div>
                  </div>
                `).join('')}
              </div>

              <button class="btn-nav-touch primary" style="width:100%;" onclick="app.closeModalSlot()">Fermer</button>
            </div>
          </div>
        `;
      }

      closeModalSlot(e) {
        if (!e || e.target.classList.contains("cheat-alert-modal")) {
          document.getElementById("modalSlot").innerHTML = "";
        }
      }

      exportDataJson() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem("yonah_dm_v4_store") || localStorage.getItem("yonah_dm_v3_store") || "{}");
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `yonah_parcours_certifiant_${Date.now()}.json`;
        a.click();
        this.showToast("Dossier de formation exporté");
      }

      filterContent(q) {
        const query = q.toLowerCase().trim();
        const links = document.querySelectorAll(".sec-link-btn");
        links.forEach((l) => {
          const t = l.textContent.toLowerCase();
          l.style.display = t.includes(query) ? "flex" : "none";
        });
      }

      bindEvents() {
        window.addEventListener("keydown", (e) => {
          if (this.examInProgress) {
            if ((e.ctrlKey || e.metaKey) && ["c", "v", "u", "p", "a"].includes(e.key.toLowerCase())) {
              e.preventDefault();
              this.recordViolation("KEYBOARD_SHORTCUT", `Raccourci clavier Ctrl+${e.key.toUpperCase()}`);
            }
            if (["F12", "F11"].includes(e.key)) {
              e.preventDefault();
              this.recordViolation("KEYBOARD_DEVTOOLS", "Tentative d'ouverture des outils de développement");
            }
            return;
          }

          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.key === "ArrowLeft") this.navigateOffset(-1);
          if (e.key === "ArrowRight") this.navigateOffset(1);
          if (e.key === "Escape") this.closeSidebar();
        });

        document.addEventListener("contextmenu", (e) => {
          if (this.examInProgress) {
            e.preventDefault();
            this.recordViolation("CONTEXT_MENU", "Tentative de clic droit");
          }
        });

        document.addEventListener("copy", (e) => {
          if (this.examInProgress) {
            e.preventDefault();
            this.recordViolation("CLIPBOARD_COPY", "Tentative de copie");
          }
        });

        document.addEventListener("paste", (e) => {
          if (this.examInProgress) {
            e.preventDefault();
            this.recordViolation("CLIPBOARD_PASTE", "Tentative de collage");
          }
        });

        document.addEventListener("visibilitychange", () => {
          if (this.examInProgress && document.hidden) {
            this.recordViolation("TAB_SWITCH", "Sortie d'onglet / Changement d'application");
          }
        });

        window.addEventListener("blur", () => {
          if (this.examInProgress) {
            this.blurTimeout = setTimeout(() => {
              if (this.examInProgress && document.hidden) {
                this.recordViolation("WINDOW_BLUR", "Perte de focus de la fenêtre");
              }
            }, 500);
          }
        });

        window.addEventListener("focus", () => {
          if (this.blurTimeout) clearTimeout(this.blurTimeout);
        });
      }
    }

    let app;
    window.addEventListener("DOMContentLoaded", () => {
      app = new YonahTrainingEngine();
      window.app = app;
    });
  </script>
</body>
</html>
