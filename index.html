<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Yonah — Délégué Médical Professionnel | Parcours Certifiant</title>
  <meta name="description" content="Formation professionnelle certifiante pour délégués médicaux en Côte d'Ivoire et Afrique de l'Ouest — Institut d'Excellence Yonah (Abidjan).">
  <meta property="og:title" content="Yonah — Délégué Médical Professionnel">
  <meta property="og:description" content="Institut d'Excellence Yonah : formation certifiante d'élite pour délégués médicaux en Côte d'Ivoire.">
  <meta name="theme-color" content="#0B3D5C">

  <style>
    /* =====================================================================
       SYSTÈME DE DESIGN YONAH — COULEURS, VARIABLES ET TYPOGRAPHIE
       ===================================================================== */
    :root {
      --yonah-navy: #0B3D5C;
      --yonah-navy-dark: #062335;
      --yonah-navy-light: #16537b;
      --yonah-gold: #D4A24C;
      --yonah-gold-light: #fef7ec;
      --yonah-gold-dark: #a87926;
      --yonah-emerald: #0E7C66;
      --yonah-emerald-light: #e6f6f2;
      --yonah-cream: #F8F5EE;
      --yonah-gray: #4A5568;
      --yonah-gray-light: #718096;
      --yonah-danger: #C53030;
      --yonah-danger-light: #FFF5F5;
      --yonah-warning: #DD6B20;
      --yonah-warning-light: #FFFAF0;

      --bg: #F8F5EE;
      --surface: #FFFFFF;
      --surface-subtle: #F0EDE4;
      --border: #E2DBD0;
      --border-focus: #0B3D5C;
      --text-main: #1A202C;
      --text-muted: #4A5568;
      --text-on-dark: #FFFFFF;

      --shadow-sm: 0 1px 3px rgba(11, 61, 92, 0.08);
      --shadow-md: 0 4px 12px rgba(11, 61, 92, 0.12);
      --shadow-lg: 0 10px 25px rgba(11, 61, 92, 0.18);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;

      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --touch-min: 44px;
    }

    [data-theme="dark"] {
      --bg: #061824;
      --surface: #0B283D;
      --surface-subtle: #103753;
      --border: #1B4C72;
      --border-focus: #D4A24C;
      --text-main: #F7FAFC;
      --text-muted: #CBD5E0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    /* =====================================================================
       RESET, BASE & ACCESSIBILITÉ
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-system);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.65;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 1rem;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      min-height: var(--touch-min);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    :focus-visible {
      outline: 3px solid var(--yonah-gold);
      outline-offset: 2px;
    }

    /* =====================================================================
       LAYOUT GÉNÉRAL (MOBILE-FIRST)
       ===================================================================== */
    #appWrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* EN-TÊTE SUPÉRIEURE */
    .topbar {
      height: 60px;
      background: var(--yonah-navy);
      color: var(--text-on-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      border-bottom: 2px solid var(--yonah-gold);
      z-index: 30;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
    }

    .brand-logo-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--yonah-gold);
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      color: var(--text-on-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* SIDEBAR (DESKTOP / TIROIR MOBILE) */
    .sidebar {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 45;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-user-card {
      padding: 1rem;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-avatar-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--yonah-navy);
      color: var(--yonah-gold);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      border: 2px solid var(--yonah-gold);
    }

    .user-info-text {
      display: flex;
      flex-direction: column;
    }

    .user-name-display {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-main);
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-level-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--yonah-emerald);
    }

    .sidebar-stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0.6rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--text-main);
    }

    .sidebar-search-box {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    .search-input-field {
      width: 100%;
      padding: 0.55rem 0.85rem 0.55rem 2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon-inside {
      position: absolute;
      left: 0.6rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.65rem 4rem;
    }

    .mod-group {
      margin-bottom: 0.5rem;
    }

    .mod-header-btn {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .mod-header-btn:hover {
      background: var(--surface-subtle);
    }

    .mod-header-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 1;
    }

    .badge-number {
      background: var(--yonah-navy);
      color: var(--yonah-gold);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
    }

    .sec-list {
      list-style: none;
      padding-left: 0.6rem;
      margin-top: 0.2rem;
    }

    .mod-group.collapsed .sec-list {
      display: none;
    }

    .sec-link-btn {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.15rem;
    }

    .sec-link-btn:hover {
      background: var(--surface-subtle);
      color: var(--text-main);
    }

    .sec-link-btn.active {
      background: rgba(11, 61, 92, 0.1);
      color: var(--yonah-navy);
      font-weight: 700;
      border-left: 3px solid var(--yonah-gold);
    }

    [data-theme="dark"] .sec-link-btn.active {
      background: rgba(212, 162, 76, 0.15);
      color: var(--yonah-gold);
      border-left: 3px solid var(--yonah-gold);
    }

    /* CONTENU PRINCIPAL */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .content-scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 6rem;
      -webkit-overflow-scrolling: touch;
    }

    .container-reading {
      max-width: 820px;
      margin: 0 auto;
    }

    /* BARRE INFÉRIEURE STICKY (MOBILE & DESKTOP) */
    .bottombar-sticky {
      height: 64px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 30;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .btn-nav-touch {
      min-width: 110px;
      height: 46px;
      padding: 0 1rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      color: var(--text-main);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-nav-touch.primary {
      background: var(--yonah-navy);
      color: var(--text-on-dark);
      border-color: var(--yonah-navy);
    }

    [data-theme="dark"] .btn-nav-touch.primary {
      background: var(--yonah-gold);
      color: var(--yonah-navy-dark);
      border-color: var(--yonah-gold);
    }

    .btn-nav-touch:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .nav-pos-center {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ENCADRÉS PÉDAGOGIQUES YONAH */
    .box-callout {
      border-radius: var(--radius-md);
      padding: 1.25rem 1.4rem;
      margin: 1.5rem 0;
      border-left: 5px solid transparent;
      box-shadow: var(--shadow-sm);
    }

    .box-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .box-key {
      background: rgba(11, 61, 92, 0.08);
      border-left-color: var(--yonah-navy);
    }
    .box-key .box-header { color: var(--yonah-navy); }
    [data-theme="dark"] .box-key { background: rgba(11, 61, 92, 0.3); border-left-color: #3b82f6; }
    [data-theme="dark"] .box-key .box-header { color: #93c5fd; }

    .box-warning {
      background: var(--yonah-warning-light);
      border-left-color: var(--yonah-warning);
    }
    .box-warning .box-header { color: var(--yonah-warning); }
    [data-theme="dark"] .box-warning { background: rgba(221, 107, 32, 0.2); }

    .box-example {
      background: var(--yonah-emerald-light);
      border-left-color: var(--yonah-emerald);
    }
    .box-example .box-header { color: var(--yonah-emerald); }
    [data-theme="dark"] .box-example { background: rgba(14, 124, 102, 0.25); border-left-color: #34d399; }
    [data-theme="dark"] .box-example .box-header { color: #34d399; }

    .box-pro {
      background: var(--yonah-gold-light);
      border-left-color: var(--yonah-gold);
    }
    .box-pro .box-header { color: var(--yonah-gold-dark); }
    [data-theme="dark"] .box-pro { background: rgba(212, 162, 76, 0.2); border-left-color: var(--yonah-gold); }
    [data-theme="dark"] .box-pro .box-header { color: var(--yonah-gold); }

    /* CAS PRATIQUES INTERACTIFS */
    .case-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 2rem 0;
      box-shadow: var(--shadow-md);
    }

    .case-badge-banner {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--yonah-navy);
      color: var(--yonah-gold);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .case-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.8rem;
    }

    .case-desc {
      background: var(--surface-subtle);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .case-textarea {
      width: 100%;
      min-height: 110px;
      padding: 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 1rem;
      resize: vertical;
    }

    .case-expert-reveal {
      background: var(--yonah-emerald-light);
      border: 1px solid var(--yonah-emerald);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-top: 1rem;
      animation: fadeIn 0.3s ease;
    }

    [data-theme="dark"] .case-expert-reveal {
      background: rgba(14, 124, 102, 0.25);
    }

    /* QUIZ & EXAMEN */
    .quiz-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 2rem 0;
      box-shadow: var(--shadow-sm);
    }

    .q-card {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .q-prompt {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      line-height: 1.45;
    }

    .opt-btn.correct {
      background: var(--yonah-emerald-light) !important;
      border-color: var(--yonah-emerald) !important;
      color: var(--text-main) !important;
    }

    .opt-btn.incorrect {
      background: var(--yonah-danger-light) !important;
      border-color: var(--yonah-danger) !important;
      color: var(--text-main) !important;
    }

    /* MODE EXAMEN ANTI-TRICHE PLEIN ÉCRAN */
    body.exam-mode .topbar,
    body.exam-mode .sidebar,
    body.exam-mode .bottombar-sticky {
      display: none !important;
    }

    .exam-overlay-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #742A2A;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      font-weight: 700;
    }

    .exam-timer-pill {
      background: white;
      color: #742A2A;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .exam-timer-pill.urgent {
      background: #FEB2B2;
      color: #9B2C2C;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* CERTIFICAT YONAH HAUTE SÉCURITÉ */
    .cert-wrap {
      background: white;
      color: #0B3D5C;
      border: 10px solid #0B3D5C;
      outline: 3px solid #D4A24C;
      outline-offset: -7px;
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
      margin: 2rem auto;
      max-width: 780px;
      box-shadow: var(--shadow-lg);
      background-image: radial-gradient(#D4A24C 0.65px, transparent 0.65px);
      background-size: 18px 18px;
    }

    .cert-seal-box {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.5rem;
    }

    .cert-title-huge {
      font-size: 2.2rem;
      font-weight: 900;
      color: #0B3D5C;
      letter-spacing: 2px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .cert-sub-text {
      font-size: 1.1rem;
      color: #a87926;
      font-weight: 700;
      margin-bottom: 1.75rem;
    }

    .cert-recipient {
      font-size: 2rem;
      font-weight: 900;
      color: #062335;
      display: inline-block;
      border-bottom: 2px solid #D4A24C;
      padding: 0 1.5rem 0.35rem;
      margin: 1rem 0 1.5rem;
    }

    .cert-statement {
      max-width: 620px;
      margin: 0 auto 2rem;
      font-size: 1rem;
      line-height: 1.6;
      color: #2D3748;
    }

    .cert-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      border-top: 1px solid #E2DBD0;
      padding-top: 1.5rem;
      font-size: 0.85rem;
      text-align: left;
    }

    .cert-signature-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.5rem;
    }

    .cert-sig-svg {
      width: 140px;
      height: 50px;
    }

    /* MODALE DE SÉCURITÉ ANTI-TRICHE */
    .cheat-alert-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .cheat-alert-card {
      background: var(--surface);
      max-width: 480px;
      width: 100%;
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      border: 3px solid var(--yonah-danger);
    }

    /* GESTES SWIPE & RESPONSIVE */
    @media (max-width: 767px) {
      .sidebar {
        position: fixed;
        top: 60px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        width: 85%;
        max-width: 310px;
        box-shadow: var(--shadow-lg);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        top: 60px;
        background: rgba(6, 35, 53, 0.6);
        z-index: 40;
        display: none;
      }

      .sidebar-backdrop.active {
        display: block;
      }

      .cert-meta-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    @media (min-width: 768px) {
      .menu-hamburger-btn {
        display: none;
      }
    }

    /* MEDIA PRINT (A4 CERTIFIÉ SANS INTERFACE) */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .topbar, .sidebar, .bottombar-sticky, .toast, .btn-print-hide, .home-cta-row, .cheat-alert-modal {
        display: none !important;
      }
      #appWrapper, .main-area, .content-scrollable {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
      }
      .cert-wrap {
        border-width: 5px !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

    /**
     * MOTEUR PRINCIPAL DE L'APPLICATION YONAH
     */
    class YonahTrainingEngine {
      constructor() {
        this.currentSectionId = "home";
        this.userName = "";
        this.readSections = [];
        this.bookmarks = [];
        this.moduleQuizScores = {};
        this.userCaseAnswers = {};
        this.planItemsDone = {};
        this.violations = [];
        this.isDarkMode = false;
        this.examInProgress = false;
        this.examTimerSec = 1200; // 20 minutes
        this.examInterval = null;
        this.examQuestionsActive = [];
        this.examUserAnswers = {};
        this.examResult = null;
        this.flatSections = [];
        this.streakDays = 1;
        this.blurTimeout = null;

        this.initFlatList();
        this.loadStorage();
        this.applyTheme();
        this.renderSidebar();
        this.renderCurrentView();
        this.bindEvents();
      }

      initFlatList() {
        this.flatSections = [];
        YONAH_COURSE_DATA.forEach((mod) => {
          mod.sections.forEach((sec) => {
            this.flatSections.push({
              ...sec,
              moduleId: mod.id,
              moduleBadge: mod.badge,
              moduleTitle: mod.title
            });
          });
        });
      }

      loadStorage() {
        try {
          const raw = localStorage.getItem("yonah_dm_v1_store");
          if (raw) {
            const data = JSON.parse(raw);
            this.userName = data.userName || "";
            this.readSections = Array.isArray(data.readSections) ? data.readSections : [];
            this.bookmarks = Array.isArray(data.bookmarks) ? data.bookmarks : [];
            this.moduleQuizScores = data.moduleQuizScores || {};
            this.userCaseAnswers = data.userCaseAnswers || {};
            this.planItemsDone = data.planItemsDone || {};
            this.isDarkMode = Boolean(data.isDarkMode);
            this.examResult = data.examResult || null;
            this.currentSectionId = data.lastSec || "home";
            this.streakDays = data.streakDays || 1;
          }
        } catch (e) {
          console.warn("Storage load error", e);
        }
      }

      saveStorage() {
        try {
          const payload = {
            userName: this.userName,
            readSections: this.readSections,
            bookmarks: this.bookmarks,
            moduleQuizScores: this.moduleQuizScores,
            userCaseAnswers: this.userCaseAnswers,
            planItemsDone: this.planItemsDone,
            isDarkMode: this.isDarkMode,
            examResult: this.examResult,
            lastSec: this.currentSectionId,
            streakDays: this.streakDays
          };
          localStorage.setItem("yonah_dm_v1_store", JSON.stringify(payload));
        } catch (e) {
          console.warn("Storage save error", e);
        }
      }

      applyTheme() {
        if (this.isDarkMode) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
      }

      toggleTheme() {
        this.isDarkMode = !this.isDarkMode;
        this.applyTheme();
        this.saveStorage();
        this.showToast(this.isDarkMode ? "Mode sombre activé" : "Mode clair activé");
      }

      showToast(text) {
        const el = document.getElementById("toastMessage");
        if (!el) return;
        el.textContent = text;
        el.style.opacity = "1";
        el.style.transform = "translateX(-50%) translateY(0)";
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transform = "translateX(-50%) translateY(20px)";
        }, 2200);
      }

      toggleSidebar() {
        const sb = document.getElementById("sidebar");
        const bd = document.getElementById("sideBackdrop");
        sb?.classList.toggle("open");
        bd?.classList.toggle("active");
      }

      closeSidebar() {
        const sb = document.getElementById("sidebar");
        const bd = document.getElementById("sideBackdrop");
        sb?.classList.remove("open");
        bd?.classList.remove("active");
      }

      promptUserName() {
        const cur = this.userName || "Apprenant";
        const val = prompt("Entrez votre Nom et Prénom pour la certification Yonah :", cur);
        if (val && val.trim()) {
          this.userName = val.trim();
          this.saveStorage();
          this.updateUserBadge();
          this.showToast("Profil apprenant mis à jour");
        }
      }

      updateUserBadge() {
        const elName = document.getElementById("userNameDisplay");
        const elAvatar = document.getElementById("userAvatar");
        const elLvl = document.getElementById("userLevelDisplay");
        const dispName = this.userName || "Apprenant Yonah";
        if (elName) elName.textContent = dispName;
        if (elAvatar) elAvatar.textContent = dispName.charAt(0).toUpperCase();

        const xp = this.readSections.length * 50 + Object.keys(this.moduleQuizScores).length * 150 + (this.examResult?.passed ? 1000 : 0);
        let lvl = "Débutant";
        if (xp >= 2500 || this.examResult?.passed) lvl = "Expert Terrain";
        else if (xp >= 1500) lvl = "Confirmé";
        else if (xp >= 600) lvl = "Intermédiaire";

        if (elLvl) elLvl.textContent = `Niveau : ${lvl} (${xp} XP)`;
      }

      calculateProgress() {
        const total = this.flatSections.length;
        if (total === 0) return 0;
        const read = new Set(this.readSections).size;
        return Math.min(100, Math.round((read / total) * 100));
      }

      showHome() {
        if (this.examInProgress) return;
        this.currentSectionId = "home";
        this.saveStorage();
        this.closeSidebar();
        this.renderCurrentView();
        this.renderSidebar();
      }

      goToSection(id) {
        if (this.examInProgress && id !== "m10-exam") {
          alert("Examen en cours ! Terminez ou soumettez l'épreuve avant de naviguer.");
          return;
        }
        this.currentSectionId = id;
        this.saveStorage();
        this.closeSidebar();
        this.renderCurrentView();
        this.renderSidebar();
        document.getElementById("mainContentScroll")?.scrollTo({ top: 0, behavior: "smooth" });
      }

      navigateOffset(offset) {
        if (this.examInProgress) return;
        if (this.currentSectionId === "home") {
          if (offset > 0 && this.flatSections.length > 0) {
            this.goToSection(this.flatSections[0].id);
          }
          return;
        }
        const idx = this.flatSections.findIndex((s) => s.id === this.currentSectionId);
        if (idx === -1) return;
        const target = idx + offset;
        if (target < 0) {
          this.showHome();
        } else if (target < this.flatSections.length) {
          this.goToSection(this.flatSections[target].id);
        }
      }

      toggleSectionRead(id) {
        if (this.readSections.includes(id)) {
          this.readSections = this.readSections.filter((x) => x !== id);
          this.showToast("Section marquée comme non lue");
        } else {
          this.readSections.push(id);
          this.showToast("Section validée ! +50 XP");
        }
        this.saveStorage();
        this.updateUserBadge();
        this.renderSidebar();
        this.renderCurrentView();
      }

      renderSidebar() {
        const nav = document.getElementById("sidebarModuleList");
        if (!nav) return;
        this.updateUserBadge();

        const pct = this.calculateProgress();
        const elPct = document.getElementById("progressPctText");
        if (elPct) elPct.textContent = `${pct}%`;

        let html = `
          <div class="mod-group">
            <button class="sec-link-btn ${this.currentSectionId === "home" ? "active" : ""}" onclick="app.showHome()">
              <span>🏠 Accueil du parcours</span>
            </button>
          </div>
        `;

        YONAH_COURSE_DATA.forEach((mod) => {
          const hasActive = mod.sections.some((s) => s.id === this.currentSectionId);
          html += `
            <div class="mod-group" id="modBox-${mod.id}">
              <button class="mod-header-btn" onclick="app.toggleModCollapse(${mod.id})">
                <div class="mod-header-title">
                  <span class="badge-number">${mod.id}</span>
                  <span style="line-height:1.2;">${mod.title.replace(/^Module \d+ : /, '')}</span>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <ul class="sec-list">
          `;

          mod.sections.forEach((sec) => {
            const isActive = sec.id === this.currentSectionId;
            const isRead = this.readSections.includes(sec.id);
            html += `
              <li>
                <button class="sec-link-btn ${isActive ? "active" : ""}" onclick="app.goToSection('${sec.id}')">
                  <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:210px;">${sec.title}</span>
                  ${isRead ? '<span style="color:var(--yonah-emerald); font-weight:800;">✓</span>' : ''}
                </button>
              </li>
            `;
          });

          html += `</ul></div>`;
        });

        nav.innerHTML = html;
      }

      toggleModCollapse(modId) {
        const el = document.getElementById(`modBox-${modId}`);
        el?.classList.toggle("collapsed");
      }

      renderCurrentView() {
        const mount = document.getElementById("readingContainer");
        const posText = document.getElementById("navPosText");
        const btnPrev = document.getElementById("btnNavPrev");
        const btnNext = document.getElementById("btnNavNext");
        if (!mount) return;

        if (this.currentSectionId === "home") {
          this.renderHome(mount);
          if (posText) posText.textContent = "Accueil Yonah";
          if (btnPrev) btnPrev.disabled = true;
          if (btnNext) {
            btnNext.disabled = false;
            btnNext.querySelector("span").textContent = "Commencer";
          }
          return;
        }

        const sec = this.flatSections.find((s) => s.id === this.currentSectionId);
        if (!sec) return;

        const idx = this.flatSections.findIndex((s) => s.id === sec.id);
        const total = this.flatSections.length;
        if (posText) posText.textContent = `Section ${idx + 1} / ${total}`;
        if (btnPrev) btnPrev.disabled = false;
        if (btnNext) {
          btnNext.disabled = idx === total - 1;
          btnNext.querySelector("span").textContent = idx === total - 1 ? "Fin" : "Suivant";
        }

        const isRead = this.readSections.includes(sec.id);

        let html = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:0.75rem;">
            <span style="font-size:0.85rem; font-weight:700; color:var(--yonah-gold); text-transform:uppercase;">${sec.moduleTitle}</span>
            <button class="btn-nav-touch" onclick="app.toggleSectionRead('${sec.id}')" style="min-width:auto; height:36px; padding:0 0.75rem; font-size:0.82rem; ${isRead ? 'background:var(--yonah-emerald-light); color:var(--yonah-emerald); border-color:var(--yonah-emerald);' : ''}">
              ${isRead ? '✓ Lu et validé' : 'Marquer comme lu (+50 XP)'}
            </button>
          </div>
          <h1 style="font-size:1.7rem; font-weight:900; color:var(--text-main); margin-bottom:1.25rem; line-height:1.25;">${sec.title}</h1>
          <div style="font-size:1.02rem; line-height:1.75; color:var(--text-main);">
            ${sec.html || ''}
          </div>
        `;

        mount.innerHTML = html;

        // Montages spécifiques
        if (sec.isCase) {
          this.mountCaseStudy(sec);
        } else if (sec.isQuiz) {
          this.mountModuleQuiz(sec.quizModuleId);
        } else if (sec.isPlanChecklist) {
          this.mountPlanChecklist();
        } else if (sec.isExamContract) {
          this.mountExamContract();
        } else if (sec.isFinalExamSession) {
          this.mountExamSession();
        } else if (sec.isCertificateView) {
          this.mountCertificateView();
        }
      }

      /* RENDU DE L'ACCUEIL */
      renderHome(mount) {
        const pct = this.calculateProgress();
        const userNameDisp = this.userName || "Futur Délégué Médical";

        mount.innerHTML = `
          <div style="background:linear-gradient(135deg, #0B3D5C 0%, #062335 100%); color:white; border-radius:var(--radius-lg); padding:2rem 1.5rem; border:2px solid var(--yonah-gold); box-shadow:var(--shadow-lg); margin-bottom:2rem; text-align:center;">
            <div style="display:inline-block; background:rgba(212,162,76,0.2); color:var(--yonah-gold); padding:0.3rem 0.85rem; border-radius:var(--radius-full); font-size:0.8rem; font-weight:800; margin-bottom:1rem; letter-spacing:0.5px;">
              INSTITUT D'EXCELLENCE YONAH — ABIDJAN
            </div>
            <h1 style="font-size:1.9rem; font-weight:900; line-height:1.2; margin-bottom:0.75rem;">
              Délégué Médical Professionnel
            </h1>
            <p style="font-size:1rem; opacity:0.9; max-width:620px; margin:0 auto 1.5rem; line-height:1.6;">
              Parcours certifiant d'élite conçu pour le terrain ivoirien et ouest-africain. Maîtrisez la science, l'éthique AIRP et les techniques de visite à fort impact.
            </p>
            <div style="background:rgba(255,255,255,0.1); border-radius:var(--radius-md); padding:1rem; max-width:440px; margin:0 auto 1.5rem;">
              <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:0.5rem; color:var(--yonah-gold);">
                Nom & Prénom de l'apprenant (pour le certificat officiel) :
              </label>
              <input type="text" id="homeNameInput" value="${this.userName}" placeholder="ex : KOUASSI Jean-Yves" style="width:100%; padding:0.6rem; border-radius:var(--radius-sm); border:1px solid var(--yonah-gold); text-align:center; font-weight:700;" onchange="app.saveHomeName(this.value)">
            </div>
            <div class="home-cta-row" style="display:flex; justify-content:center; gap:0.75rem; flex-wrap:wrap;">
              <button class="btn-nav-touch primary" onclick="app.navigateOffset(1)" style="padding:0 1.5rem; height:50px; font-size:1rem;">
                ${pct > 0 ? "Reprendre ma formation" : "Commencer le Module 1"}
              </button>
              <button class="btn-nav-touch" onclick="app.goToSection('m10-integrity')" style="background:rgba(255,255,255,0.15); color:white; border-color:var(--yonah-gold); height:50px;">
                Passer l'Examen & Certificat
              </button>
            </div>
          </div>

          <!-- MODULES OVERVIEW -->
          <h2 style="font-size:1.35rem; font-weight:800; margin-bottom:1rem; color:var(--text-main);">Curriculum officiel en 10 Modules</h2>
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem; margin-bottom:2.5rem;">
            ${YONAH_COURSE_DATA.map((m) => `
              <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:1.25rem; box-shadow:var(--shadow-sm); cursor:pointer;" onclick="app.goToSection('${m.sections[0].id}')">
                <span class="badge-number" style="margin-bottom:0.4rem; display:inline-block;">${m.badge}</span>
                <h3 style="font-size:1rem; font-weight:800; color:var(--text-main); margin-bottom:0.4rem;">${m.title}</h3>
                <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5;">${m.objective}</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      saveHomeName(val) {
        this.userName = val.trim();
        this.saveStorage();
        this.updateUserBadge();
        this.showToast("Nom enregistré pour la certification");
      }

      /* CAS PRATIQUE INTERACTIF */
      mountCaseStudy(sec) {
        const box = document.createElement("div");
        box.className = "case-card";
        const savedAns = this.userCaseAnswers[sec.caseId] || "";

        box.innerHTML = `
          <div class="case-badge-banner">CAS RÉEL TERRAIN IVOIRIEN</div>
          <div class="case-title">${sec.title}</div>
          <div class="case-desc">
            <strong>Contexte :</strong> ${sec.caseContext}<br><br>
            <strong>Problème :</strong> ${sec.caseProblem}
          </div>
          <label style="display:block; font-size:0.88rem; font-weight:700; margin-bottom:0.4rem;">Votre décision opérationnelle :</label>
          <textarea id="caseInput-${sec.caseId}" class="case-textarea" placeholder="Saisissez ici ce que vous dites et faites concrètement...">${savedAns}</textarea>
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <button class="btn-nav-touch" onclick="app.saveCaseAnswer('${sec.caseId}')">Enregistrer ma réponse</button>
            <button class="btn-nav-touch primary" onclick="app.revealCaseExpert('${sec.caseId}')">Voir la réponse experte Yonah</button>
          </div>
          <div id="caseRevealBox-${sec.caseId}" style="display:${savedAns ? 'block' : 'none'};">
            <div class="case-expert-reveal">
              <strong style="color:var(--yonah-emerald); display:block; margin-bottom:0.4rem;">✓ Réponse Modèle du Comité Scientifique Yonah :</strong>
              <p style="font-size:0.95rem; line-height:1.6;">${sec.expertAnswer}</p>
              <div class="box-callout box-key" style="margin-top:0.8rem; margin-bottom:0;">
                <div class="box-header">Points clés à retenir</div>
                <p style="font-size:0.9rem;">${sec.keyTakeaways}</p>
              </div>
            </div>
          </div>
        `;

        document.getElementById("readingContainer")?.appendChild(box);
      }

      saveCaseAnswer(caseId) {
        const input = document.getElementById(`caseInput-${caseId}`);
        if (!input) return;
        this.userCaseAnswers[caseId] = input.value.trim();
        this.saveStorage();
        this.showToast("Réponse sauvegardée dans votre dossier");
      }

      revealCaseExpert(caseId) {
        this.saveCaseAnswer(caseId);
        const el = document.getElementById(`caseRevealBox-${caseId}`);
        if (el) el.style.display = "block";
      }

      /* QUIZ DE MODULE */
      mountModuleQuiz(modId) {
        const mount = document.createElement("div");
        mount.className = "quiz-box";

        const questions = EXAM_QUESTION_BANK.slice((modId - 1) * 3, (modId - 1) * 3 + 3);
        const savedScore = this.moduleQuizScores[modId];

        mount.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; border-bottom:1px solid var(--border); padding-bottom:0.75rem;">
            <h3 style="font-size:1.2rem; font-weight:800; color:var(--yonah-navy);">Mini-Quiz Spaced Repetition : Module ${modId}</h3>
            <span style="font-weight:700; color:var(--yonah-gold); font-size:0.9rem;">${savedScore !== undefined ? `Validé : ${savedScore}/3` : '3 questions'}</span>
          </div>
          ${questions.map((q, idx) => `
            <div class="q-card">
              <div class="q-prompt">${idx + 1}. ${q.q}</div>
              <div class="opt-list">
                ${q.opts.map((opt, oIdx) => `
                  <button class="opt-btn" id="mQ-${modId}-${q.id}-${oIdx}" onclick="app.answerModuleQuiz(${modId}, ${q.id}, ${oIdx})">
                    <span>${String.fromCharCode(65 + oIdx)}.</span>
                    <span>${opt}</span>
                  </button>
                `).join('')}
              </div>
              <div id="mQFeed-${q.id}" style="display:none; margin-top:0.6rem; font-size:0.88rem; padding:0.5rem; border-radius:var(--radius-sm);"></div>
            </div>
          `).join('')}
        `;

        document.getElementById("readingContainer")?.appendChild(mount);
      }

      answerModuleQuiz(modId, qId, chosenIdx) {
        const q = EXAM_QUESTION_BANK.find((x) => x.id === qId);
        if (!q) return;

        q.opts.forEach((_, idx) => {
          const btn = document.getElementById(`mQ-${modId}-${qId}-${idx}`);
          if (!btn) return;
          btn.disabled = true;
          if (idx === q.c) btn.classList.add("correct");
          else if (idx === chosenIdx) btn.classList.add("incorrect");
        });

        const feed = document.getElementById(`mQFeed-${qId}`);
        if (feed) {
          feed.style.display = "block";
          const isRight = chosenIdx === q.c;
          feed.style.background = isRight ? "var(--yonah-emerald-light)" : "var(--yonah-danger-light)";
          feed.innerHTML = `<strong>${isRight ? '✓ Exact !' : '✗ Incorrect.'}</strong> ${q.exp}`;
        }

        if (chosenIdx === q.c) {
          this.moduleQuizScores[modId] = (this.moduleQuizScores[modId] || 0) + 1;
          this.saveStorage();
          this.updateUserBadge();
        }
      }

      /* PLAN 30-60-90 JOURS INTERACTIF */
      mountPlanChecklist() {
        const mount = document.getElementById("yonahPlanMount");
        if (!mount) return;

        const milestones = [

      /* PROTOCOLE ANTI-TRICHE & SESSION EXAMEN */

          this.promptUserName();
          return;
        }

        // 1. Plein écran
        try {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } catch (e) {}

        this.examInProgress = true;
        this.violations = [];
        this.examTimerSec = 1200; // 20 min
        this.examUserAnswers = {};

        // Tirage aléatoire de 30 questions parmi 60
        const shuffledPool = [...EXAM_QUESTION_BANK].sort(() => 0.5 - Math.random());
        this.examQuestionsActive = shuffledPool.slice(0, 30);

        document.body.classList.add("exam-mode");
        this.startExamTimer();
        this.goToSection("m10-exam");

      startExamTimer() {
        if (this.examInterval) clearInterval(this.examInterval);
        this.examInterval = setInterval(() => {
          this.examTimerSec--;
          const timerEl = document.getElementById("examLiveTimer");
          if (timerEl) {
            const m = Math.floor(this.examTimerSec / 60);
            const s = this.examTimerSec % 60;
            timerEl.textContent = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
            if (this.examTimerSec <= 300) timerEl.classList.add("urgent");
          }

          if (this.examTimerSec <= 0) {
            clearInterval(this.examInterval);
            this.finishExam(true); // Forcé par temps écoulé
          }
        }, 1000);
      }

      recordViolation(type, msg) {
        if (!this.examInProgress) return;
        const v = {
          type,
          msg,
          timestamp: new Date().toLocaleTimeString("fr-FR"),
          secLeft: this.examTimerSec
        };
        this.violations.push(v);

        if (this.violations.length >= 3) {
          // Invalidation immédiate
          clearInterval(this.examInterval);
          this.finishExam(false, true);
        } else {
          this.showCheatAlert(v, this.violations.length);
        }

      async finishExam(forcedTimeout = false, invalidated = false) {
        if (this.examInterval) clearInterval(this.examInterval);
        this.examInProgress = false;
        document.body.classList.remove("exam-mode");

        if (document.exitFullscreen) {
          try { document.exitFullscreen().catch(() => {}); } catch (e) {}
        }

        let score = 0;
        this.examQuestionsActive.forEach((q) => {
          if (this.examUserAnswers[q.id] === q.c) score++;
        });

        const pct = Math.round((score / 30) * 100);
        const passed = pct >= 80 && !invalidated;

        // Génération ID et hash cryptographique SubtleCrypto SHA-256
        const dateStr = new Date().toLocaleDateString("fr-FR");
        const rawString = `${this.userName}|${dateStr}|YONAH-DM|${score}|${this.violations.length}`;
        const encoder = new TextEncoder();
        const data = encoder.encode(rawString);
        let hashHex = "9F8A2B";
        try {
          const hashBuffer = await crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          hashHex = hashArray.map((b) => b.toString(16).padStart(2, "0")).join("").substring(0, 6).toUpperCase();
        } catch (e) {
          hashHex = Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        const certId = `YONAH-DM-2025-${hashHex}`;

        this.examResult = {
          score,
          total: 30,
          pct,
          passed,
          invalidated,
          certId,
          date: dateStr,
          violationsCount: this.violations.length,
          violationsLog: this.violations
        };

        this.saveStorage();
        this.updateUserBadge();
        this.goToSection("m10-cert");
      }

      /* BINDING GLOBAL DES ÉVÉNEMENTS (GESTES TACTILES & ANTI-TRICHE) */
      bindEvents() {
        // Clavier
        window.addEventListener("keydown", (e) => {
          if (this.examInProgress) {
            // Blocage touches triche
            if ((e.ctrlKey || e.metaKey) && ["c", "v", "u", "p", "a"].includes(e.key.toLowerCase())) {
              e.preventDefault();
              this.recordViolation("KEYBOARD_SHORTCUT", `Tentative de raccourci clavier Ctrl+${e.key.toUpperCase()}`);
            }
            if (["F12", "F11"].includes(e.key)) {
              e.preventDefault();
              this.recordViolation("KEYBOARD_DEVTOOLS", "Tentative d'ouverture des outils développeur");
            }
            return;
          }

          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.key === "ArrowLeft") this.navigateOffset(-1);
          if (e.key === "ArrowRight") this.navigateOffset(1);
          if (e.key === "Escape") this.closeSidebar();
        });

        // Anti-triche : Clic droit et presse-papier
        document.addEventListener("contextmenu", (e) => {
          if (this.examInProgress) {
            e.preventDefault();
            this.recordViolation("CONTEXT_MENU", "Tentative de clic droit");
          }
        });

        document.addEventListener("copy", (e) => {
          if (this.examInProgress) {
            e.preventDefault();
            this.recordViolation("CLIPBOARD_COPY", "Tentative de copie de texte d'examen");
          }
        });

        document.addEventListener("paste", (e) => {
          if (this.examInProgress) {
            e.preventDefault();
            this.recordViolation("CLIPBOARD_PASTE", "Tentative de collage externe");
          }
        });

        // Anti-triche : Changement d'onglet (Page Visibility API + Blur avec grâce 500ms)
        document.addEventListener("visibilitychange", () => {
          if (this.examInProgress && document.hidden) {
            this.recordViolation("TAB_SWITCH", "Sortie d'onglet / Changement d'application");
          }
        });

        window.addEventListener("blur", () => {
          if (this.examInProgress) {
            this.blurTimeout = setTimeout(() => {
              if (this.examInProgress && document.hidden) {
                this.recordViolation("WINDOW_BLUR", "Perte de focus de la fenêtre d'examen");
              }
            }, 500);
          }
        });

        window.addEventListener("focus", () => {
          if (this.blurTimeout) clearTimeout(this.blurTimeout);
        });

        // Gestes Swipe tactiles sur mobile
        let touchStartX = 0;
        let touchEndX = 0;
        const mainEl = document.getElementById("mainContentScroll");

        mainEl?.addEventListener("touchstart", (e) => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        mainEl?.addEventListener("touchend", (e) => {
          touchEndX = e.changedTouches[0].screenX;
          const diff = touchEndX - touchStartX;
          if (Math.abs(diff) > 75) {
            if (diff < 0) this.navigateOffset(1); // Swipe gauche -> suivant
            else this.navigateOffset(-1); // Swipe droite -> précédent
          }
        }, { passive: true });
      }
    }

    // Lancement
    let app;
    window.addEventListener("DOMContentLoaded", () => {
      app = new YonahTrainingEngine();
      window.app = app;
    });
